# The type-check and every part's tests, and the e2e (a throwaway AnythingLLM in a container), on
# Linux, the one platform the suite is tested on. The hooks stay the gate before a push; this is the
# same scripts on a clean machine.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run shared:test
      - run: node build.mjs # every part: the installer carries the others
      - run: npm run install:unit
      - run: npm run control:unit
      - run: npm run skills:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm ci
        working-directory: packages
      - run: tools/e2e
