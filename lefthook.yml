# Git hooks, the gate before a push (.github/workflows/test.yml runs the same tests in CI). Install once per clone:
#   lefthook install
# A hook runs only when a staged or pushed file matches its glob. tools/check knows the installer,
# the control server and the skills (their unit tests, not a container run: that is `make e2e`);
# their imports are checked when they are built (packages/build.mjs).

pre-push:
  commands:
    install:
      glob: ["packages/install/**/*.{ts,mts,mjs,json}", "packages/*.{json,mjs,mts}", "packages/shared/**"]
      run: tools/check install
    control:
      glob: ["packages/control/**/*.{ts,mts,mjs,json}", "packages/*.{json,mjs,mts}", "packages/shared/**"]
      run: tools/check control
    skills:
      glob: ["packages/skills/**/*.{js,ts,mts,mjs,json,html,css,md}", "packages/*.{json,mjs,mts}", "packages/shared/**"]
      run: tools/check skills
