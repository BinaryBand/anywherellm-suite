<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Apps</title>
<style>
/* The apps manager (src/manager.ts): every workspace's apps on one page, and the trash. What's done
   here is posted under the manager's title and applied by the apps skill. The look is the Vault's
   (AnywhereLLM Lite's); ?theme=light or dark keeps it to one, and #ws=<workspace> opens on that
   workspace's apps. */
/* house tokens: AnywhereLLM Lite's colours (the design canvas's lite.css), the same in every page. Dark
   follows the device unless <html data-theme> is light or dark; high contrast follows prefers-contrast,
   and <html data-contrast> more or off forces it. */
:root{color-scheme:light dark;
--bg:light-dark(oklch(0.962 0.012 272),oklch(0.19 0.014 272));
--panel:light-dark(oklch(0.995 0.002 272),oklch(0.27 0.018 272));
--well:light-dark(oklch(0.94 0.016 272),oklch(0.31 0.02 272));
--page:light-dark(oklch(0.99 0 0),oklch(0.18 0.01 280));
--line:light-dark(oklch(0.89 0.014 272),oklch(0.4 0.022 272));
--line2:light-dark(oklch(0.925 0.012 272),oklch(0.33 0.02 272));
--ink:light-dark(oklch(0.25 0.03 272),oklch(0.94 0.01 272));
--ink2:light-dark(oklch(0.38 0.028 272),oklch(0.82 0.014 272));
--muted:light-dark(oklch(0.46 0.025 272),oklch(0.72 0.02 272));
--accent:light-dark(oklch(0.54 0.22 272),oklch(0.62 0.18 272));
--accentbg:light-dark(oklch(0.908 0.044 270),oklch(0.34 0.09 272));
--accentfg:light-dark(oklch(0.45 0.209 272),oklch(0.834 0.082 269));
--onaccent:light-dark(oklch(1 0 0),oklch(0.2 0.05 272));
--hover:light-dark(oklch(0.925 0.016 272),oklch(0.31 0.02 272));
--sel:light-dark(oklch(0.917 0.04 270),oklch(0.331 0.063 272));
--okfg:light-dark(oklch(0.468 0.083 184),oklch(0.801 0.12 185));
--okbg:light-dark(oklch(0.945 0.04 185),oklch(0.32 0.05 185));
--okdot:light-dark(oklch(0.628 0.111 184),oklch(0.726 0.128 184));
--warnfg:light-dark(oklch(0.529 0.119 64),oklch(0.83 0.12 65));
--warnbg:light-dark(oklch(0.944 0.039 66),oklch(0.319 0.05 65));
--badfg:light-dark(oklch(0.42 0.17 27),oklch(0.7 0.119 27));
--edge:light-dark(oklch(0.58 0.02 272),oklch(0.6 0.022 272));
--off:light-dark(oklch(0.84 0.012 272),oklch(0.42 0.02 272));
--bubble:light-dark(oklch(0.917 0.04 270),oklch(0.319 0.064 271));
--scrim:light-dark(oklch(0.25 0.03 272 / 0.4),oklch(0.1 0.02 272 / 0.6));
--shadow:light-dark(oklch(0.35 0.06 272 / 0.14),oklch(0.05 0.02 272 / 0.4));
--tileedge:transparent;
--hi:light-dark(transparent,oklch(1 0 0 / 0.06));
--sh0:light-dark(oklch(0.35 0.06 272 / 0.1),transparent);
--sh1:light-dark(oklch(0.35 0.06 272 / 0.08),transparent);
--sh2:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.4));
--sh3:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.3));
--tileshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh1),0 4px 8px var(--sh2),0 12px 24px var(--sh3);
--chipshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh0),0 4px 8px var(--sh2);
--fl1:light-dark(oklch(0.35 0.06 272 / 0.28),oklch(0 0 0 / 0.5));
--fl2:light-dark(oklch(0.35 0.06 272 / 0.16),oklch(0 0 0 / 0.3));
--float:0 12px 32px -8px var(--fl1),0 2px 6px var(--fl2);
--glow:0 8px 24px -4px color-mix(in oklab,var(--accent) 35%,transparent);
--sheetbg:var(--panel);
--sheetblur:none;
--sheetedge:transparent;
--sheethi:light-dark(oklch(1 0 0 / 0.7),oklch(1 0 0 / 0.1));
--meshA:light-dark(oklch(0.91 0.055 350),oklch(0.30 0.08 340));
--meshB:light-dark(oklch(0.89 0.07 295),oklch(0.32 0.10 295));
--meshC:light-dark(oklch(0.91 0.045 255),oklch(0.30 0.07 255))}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-contrast: more){:root:not([data-contrast="off"]){
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}}
:root[data-contrast="more"]{
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}
/* end of house tokens */
:root{--sans:'Instrument Sans','Noto Sans','Segoe UI',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input:focus-visible,.row.link:focus-visible{outline-offset:-3px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.top .name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.top h1{margin:0;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.top small{font:12px var(--mono);color:var(--muted)}
.rb{flex:none;width:48px;height:48px;border-radius:50%;background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--edge),var(--float)}
.rb.back{border:1px solid var(--tileedge);box-shadow:var(--chipshadow)}
main{max-width:640px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.lead,.cap{margin:0;padding:0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:16px;background:var(--hover)}
.seg button{flex:1;min-height:44px;padding:0 4px;border-radius:13px;font-size:15px;line-height:1.2;text-align:center}
.seg [aria-selected="true"]{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--edge);font-weight:600}
section{display:flex;flex-direction:column;gap:16px}
.lab{padding:0 20px;margin-bottom:-8px;font-size:12px;font-weight:500;letter-spacing:.48px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--tileedge);border-radius:24px;padding:0 20px;display:flex;flex-direction:column;box-shadow:var(--tileshadow)}
.card>*+*{border-top:1px solid var(--line2)}
.row{min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 0}
.link{width:100%;text-align:left}
.link>svg{flex:none;color:var(--muted)}
.chip{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accentbg);color:var(--accentfg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.who small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small.mono,.mono{font-family:var(--mono);font-size:12px}
#one .who small{white-space:normal}
.act{flex:none;min-height:44px;padding:0 14px;border-radius:99px;color:var(--accentfg);font-size:15px;font-weight:500}
.btn{min-height:44px;padding:0 18px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.pri{border-radius:999px;background:var(--accent);border-color:var(--accent);color:var(--onaccent);box-shadow:var(--glow)}
.bad{color:var(--badfg)}
.pair{display:flex;gap:12px}.pair>*{flex:1;padding:0 12px}
.card.solo{padding:16px;gap:14px}
.card.gone{padding:20px;gap:8px}
.card.solo>*+*{border-top:0}
.sum{margin:0;font-size:15px;color:var(--ink2)}
.empty{margin:0;padding:20px 0;font-size:15px;color:var(--muted)}
.warn{padding:12px 16px;border-radius:16px;background:var(--warnbg);color:var(--warnfg);font-size:13px;line-height:1.45}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:8px}
.foot .btn{border:0;background:none;color:var(--badfg);padding:0 8px}
.scrim{position:fixed;inset:0;z-index:3;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--sheetedge);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -12px 32px -12px var(--shadow);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.grip{align-self:center;flex:none;width:40px;height:4px;margin-top:10px;border-radius:99px;background:var(--line)}
.q{display:flex;flex-direction:column;gap:20px;padding:14px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.q h2{margin:0 0 6px;font-size:19px;font-weight:600}
.q p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.q label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink2)}
.fld{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-size:16px}
.two{display:flex;gap:12px}
.two button{flex:1;min-height:52px;padding:0 12px;border-radius:16px;background:var(--panel);font-size:16px;font-weight:500}
.two .keep{border:2px solid var(--accent);color:var(--ink)}
.two .keep.soft{border:1px solid var(--edge)}
.two .go{border:1px solid var(--edge);color:var(--badfg)}
.two .yes{border:0;border-radius:999px;background:var(--accent);color:var(--onaccent);box-shadow:var(--glow)}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;max-width:600px;margin:0 auto;min-height:56px;padding:0 8px 0 20px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--float);font-size:15px;display:flex;align-items:center;gap:12px}
#toast span{flex:1;min-width:0;padding:8px 0}
#toast button{flex:none;min-height:44px;padding:0 14px;border-radius:99px;color:var(--bg);font-weight:700}
</style>
</head>
<body>
<header class="top">
  <button class="rb" id="close" aria-label="Close"></button>
  <div class="name"><h1 id="title">Apps</h1><small id="sub" hidden></small></div>
</header>
<main>
  <p class="lead" id="lead">Every workspace's apps. Open one to see its page, its changes and its earlier versions, to rename it or to move it to the trash.</p>
  <nav class="seg" role="tablist" aria-label="Show" id="tabs">
    <button role="tab" data-tab="apps" aria-selected="true">Apps</button>
    <button role="tab" data-tab="trash" aria-selected="false">Trash</button>
  </nav>
  <section id="apps"></section>
  <section id="trash" hidden></section>
  <section id="one" hidden></section>
  <div class="foot" id="foot"><p class="cap">Anyone with this page's link can see what it shows and act on it.</p></div>
</main>
<div id="toast" role="status" hidden><span></span><button type="button" hidden>Undo</button></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const query = new URLSearchParams(location.search);
  const theme = query.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const node = Object.assign(document.createElement(tag), props); node.append(...kids.filter((kid) => kid !== null && kid !== undefined && kid !== false)); return node; };
  const icon = (d, size = 18) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); for (const [k, v] of [["width", size], ["height", size], ["viewBox", "0 0 16 16"], ["fill", "none"], ["stroke", "currentColor"], ["stroke-width", "1.6"], ["stroke-linecap", "round"], ["stroke-linejoin", "round"], ["aria-hidden", "true"]]) s.setAttribute(k, v); s.innerHTML = `<path d="${d}"/>`; return s; };
  const CLOSE = "M4 4l8 8M12 4l-8 8", BACK = "M10 3.5 5.5 8l4.5 4.5", CHEVRON = "M6 4l4 4-4 4";

  // ---- The toast: what was sent or done, or a refusal; with `undo`, an Undo button while it shows.
  let toastTimer = 0;
  function toast(text, undo = null, ms = 4000) {
    const box = $("toast"), button = box.querySelector("button");
    box.querySelector("span").textContent = text;
    button.hidden = !undo;
    button.onclick = () => { box.hidden = true; undo?.(); };
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (box.hidden = true), ms);
  }

  // ---- Posting: each thing done here is an event under the manager's title, posted through
  // AnythingLLM's upload, which the apps skill applies.
  async function post(ev, fields = {}) {
    const event = { apps_lean_manage: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: cfg.title, docSource: "apps-lean manager" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages' key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + res.status), false;
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can't reach AnythingLLM");
      return false;
    }
  }

  // ---- The sheet: one question at a time over the page, as on the Vault. `body` goes between the
  // question and its two buttons; `yes` runs with what `value` reads, unless `from` was drawn away.
  let asking = null;
  function ask({ title, line, yes, danger = true, body = null, value = () => null }, run, from) {
    asking?.close();
    const shade = [document.querySelector("header"), document.querySelector("main")];
    const was = shade.map((part) => part.inert);
    const id = "q" + Math.random().toString(36).slice(2, 8);
    const keep = el("button", { className: danger ? "keep" : "keep soft", type: "button", textContent: "Keep" });
    const go = el("button", { className: danger ? "go" : "yes", type: "button", textContent: yes });
    const scrim = el("div", { className: "scrim" });
    const sheet = el("section", { className: "sheet" }, el("span", { className: "grip" }),
      el("div", { className: "q" }, el("div", {}, el("h2", { id: id + "t", textContent: title }), line ? el("p", { id: id + "l", textContent: line }) : null), body, el("div", { className: "two" }, keep, go)));
    for (const [k, v] of [["role", "dialog"], ["aria-modal", "true"], ["aria-labelledby", id + "t"]]) sheet.setAttribute(k, v);
    const me = {
      close: () => {
        if (asking !== me) return;
        asking = null;
        scrim.remove(), sheet.remove();
        shade.forEach((part, i) => (part.inert = was[i]));
        if (from.isConnected) from.focus();
      },
    };
    keep.onclick = scrim.onclick = me.close;
    go.onclick = () => {
      const live = from.isConnected, v = value();
      if (v === false) return;
      me.close();
      if (live) run(v);
    };
    for (const part of shade) part.inert = true;
    document.body.append(scrim, sheet);
    asking = me;
    (body?.querySelector("input") ?? keep).focus();
  }

  // ---- What the state says, as people read it.
  const WHO = { page: "on its page", agent: "by the agent", job: "by a scheduled job" };
  const when = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); };
  const changeText = (c) => `${c.ev}${c.text ? `: ${c.text}` : ""}`;
  const daysLeft = (until) => Math.max(0, Math.ceil((Date.parse(until) - Date.now()) / 86400000));
  // The theme this page has now (a client may switch it while it's open), at the moment the link is followed.
  const pageHref = (page) => { const now = document.documentElement.dataset.theme; return page + (now === "light" || now === "dark" ? `?theme=${now}` : ""); };

  // ---- Views: the list (Apps or Trash) or one app, which is an entry of the browser's history,
  // so Back returns to the list.
  let now = null, opened = history.state?.app ?? null, tab = "apps", forward = false;
  const find = (key) => { for (const w of now?.workspaces ?? []) for (const a of w.apps) if (`${w.workspace}/${a.name}` === key) return { workspace: w.workspace, app: a }; return null; };

  function head(one) {
    $("close").replaceChildren(icon(one ? BACK : CLOSE));
    $("close").classList.toggle("back", !!one);
    $("close").setAttribute("aria-label", one ? "Back to Apps" : "Close");
    $("title").textContent = one ? one.app.title : "Apps";
    $("sub").hidden = !one;
    $("sub").textContent = one ? `${one.workspace} · ${one.app.name}` : "";
    for (const id of ["lead", "tabs", "foot"]) $(id).hidden = !!one;
    $("apps").hidden = !!one || tab !== "apps";
    $("trash").hidden = !!one || tab !== "trash";
    $("one").hidden = !one;
  }

  function draw() {
    if (!now) return;
    const one = opened && find(opened);
    if (opened && !one) return back();
    head(one);
    drawApps();
    drawTrash();
    if (one) drawOne(one);
  }

  function drawApps() {
    const count = now.workspaces.reduce((n, w) => n + w.apps.length, 0);
    document.querySelector('[data-tab="apps"]').textContent = `Apps · ${count}`;
    const parts = now.workspaces.flatMap((w) => {
      const lab = el("div", { className: "lab", textContent: w.workspace });
      lab.dataset.ws = w.workspace;
      return [lab, el("div", { className: "card" }, ...w.apps.map((a) => {
        const row = el("button", { className: "row link", type: "button", onclick: () => openApp(`${w.workspace}/${a.name}`) },
          el("span", { className: "chip", textContent: (a.title.trim()[0] || "?").toUpperCase() }),
          el("span", { className: "who" }, el("b", { textContent: a.title }), el("small", { textContent: [a.summary, when(a.changed)].filter(Boolean).join(" · ") })), icon(CHEVRON, 14));
        row.dataset.key = `${w.workspace}/${a.name}`;
        return row;
      }))];
    });
    $("apps").replaceChildren(...(parts.length ? parts : [el("div", { className: "card" }, el("p", { className: "empty", textContent: "No apps yet. Ask the agent in a chat to make one." }))]));
  }

  function drawTrash() {
    document.querySelector('[data-tab="trash"]').textContent = `Trash · ${now.trash.length}`;
    const rows = now.trash.map((x) => {
      const left = daysLeft(x.until);
      return el("div", { className: "row" }, el("div", { className: "who" }, el("b", { textContent: x.title }), el("small", { textContent: `${x.workspace} · ${left} day${left === 1 ? "" : "s"} left` })),
        el("button", { className: "act", type: "button", textContent: "Restore", onclick: () => post("restore", { id: x.id, title: x.title }) && toast("Restoring " + x.title) }));
    });
    $("trash").replaceChildren(el("p", { className: "lead", textContent: `Apps moved to the trash, each from its own workspace. Each stays ${now.trashDays} days, then it's gone.` }),
      el("div", { className: "card" }, ...(rows.length ? rows : [el("p", { className: "empty", textContent: "The trash is empty." })])),
      el("p", { className: "cap", textContent: `The trash holds ${now.trashMax}. When it's full, a delete is refused until one goes, rather than drop one early.` }));
  }

  /** A take back waits this long before it's posted, so Undo can cancel it with nothing sent. */
  const HOLD_MS = 5000;
  let held = null;
  function takeBack(one, c) {
    if (held) clearTimeout(held.timer), held.send();
    const fields = { workspace: one.workspace, app: one.app.name, n: c.n, title: one.app.title };
    held = { send: () => { held = null; post("take-back", fields); }, timer: 0 };
    held.timer = setTimeout(held.send, HOLD_MS);
    toast(`Taken back: ${changeText(c)}`, () => { clearTimeout(held?.timer); held = null; }, HOLD_MS);
  }

  function drawOne(one) {
    const { workspace, app } = one;
    const base = { workspace, app: app.name, title: app.title };
    const rename = el("button", { className: "btn", type: "button", textContent: "Rename" });
    rename.onclick = () => {
      const input = el("input", { className: "fld", type: "text", value: app.title, maxLength: 80, autocomplete: "off" });
      ask({ title: `Rename ${app.title}`, yes: "Rename", danger: false,
        body: el("div", {}, el("label", {}, "Title", input), el("p", { className: "cap", style: "padding:12px 0 0", textContent: `Its name, ${app.name}, stays: the agent and its scheduled jobs call it by that.` })),
        value: () => { const v = input.value.trim(); if (!v) return toast("Give it a title"), false; return v; } },
        (title) => title !== app.title && post("rename", { ...base, title }), rename);
    };
    const open = app.page ? el("a", { className: "btn pri", href: pageHref(app.page), onclick() { this.href = pageHref(app.page); }, textContent: "Open the page" }) : null;
    const top = el("div", { className: "card solo" }, app.summary ? el("p", { className: "sum", textContent: app.summary }) : null,
      app.page ? null : el("p", { className: "cap", style: "padding:0", textContent: "It has no page yet: the agent makes one when it builds the app." }),
      el("div", { className: "pair" }, open, rename));
    const changes = app.changes.map((c, i) => el("div", { className: "row" },
      el("div", { className: "who" }, el("b", { textContent: changeText(c) }), el("small", { textContent: `${when(c.t)} · ${WHO[c.by] ?? c.by}` })),
      i === 0 ? el("button", { className: "act", type: "button", textContent: "Take back", onclick: () => takeBack(one, c) }) : null));
    const versions = app.versions.map((v) => el("div", { className: "row" },
      el("div", { className: "who" }, el("b", { className: "mono", style: "font-size:14px", textContent: v.file }), el("small", { textContent: `as it was before ${when(v.t)}` })),
      el("button", { className: "act", type: "button", textContent: "Put back", onclick: () => post("put-back", { ...base, file: v.file, at: v.t }) && toast(`Putting back ${v.file}`) })));
    const trash = el("button", { className: "btn bad", type: "button", style: "align-self:flex-start", textContent: "Move to trash" });
    trash.onclick = () => ask({ title: `Move ${app.title} to the trash?`, line: `It stays there ${now.trashDays} days, and Restore brings it back until then. Its page stops working, and the agent and its scheduled jobs can't use it meanwhile.`, yes: "Move to trash" },
      async () => { if (await post("trash", base)) back(); }, trash);
    $("one").replaceChildren(top,
      el("div", { className: "lab", textContent: "Recent changes" }),
      el("div", { className: "card" }, ...(changes.length ? changes : [el("p", { className: "empty", textContent: "No changes yet." })])),
      el("p", { className: "cap", textContent: "The last 20 are kept. Only the newest can be taken back." }),
      el("div", { className: "lab", textContent: "Earlier versions" }),
      el("div", { className: "card" }, ...(versions.length ? versions : [el("p", { className: "empty", textContent: "No earlier versions yet." })])),
      el("p", { className: "cap", textContent: "The last 10 versions of its page and its definition. Putting one back is a change too, so it can be taken back." }),
      trash);
  }

  function show(key) {
    const was = opened;
    opened = key;
    draw();
    if (opened) window.scrollTo(0, 0), $("close").focus();
    else [...$("apps").querySelectorAll(".link")].find((b) => b.dataset.key === was)?.focus();
  }
  function openApp(key) {
    history.pushState({ app: key }, "");
    forward = false;
    show(key);
  }
  function back() {
    if (history.state?.app) history.back();
    else show(null);
  }
  window.addEventListener("popstate", (e) => { asking?.close(); forward = !e.state?.app; show(e.state?.app ?? null); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !(asking || opened)) return;
    e.preventDefault();
    asking ? asking.close() : back();
  });
  $("close").onclick = () => (opened ? back() : history.length - (forward ? 1 : 0) > 1 ? history.back() : window.close());
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => {
    tab = b.dataset.tab;
    for (const other of document.querySelectorAll("nav button")) other.setAttribute("aria-selected", String(other === b));
    head(null);
  };

  // ---- A new link, asked first.
  const rotate = el("button", { className: "btn", type: "button", textContent: "New link" });
  rotate.onclick = () => ask({ title: "Make a new link?", line: "This one stops working, everywhere it was shared.", yes: "Make it" }, () => post("rotate"), rotate);
  $("foot").append(rotate);

  // ---- The state, every few seconds; not drawn again under a question or a field being typed in.
  // What the skill did with the last event shows once, as a toast.
  let last = null, toldAt = null, first = true;
  const busy = () => !!asking || document.activeElement?.tagName === "INPUT";
  async function load() {
    try {
      const res = await fetch(`${cfg.token}.json`, { cache: "no-cache" });
      if (!res.ok) {
        head(null);
        $("tabs").hidden = $("lead").hidden = $("foot").hidden = $("trash").hidden = true;
        $("apps").hidden = false;
        return $("apps").replaceChildren(el("div", { className: "card solo gone" }, el("b", { style: "font-size:17px;font-weight:600", textContent: "This link was replaced" }),
          el("p", { className: "sum", textContent: "Open the page again from where you got it: the agent, AnywhereLLM Lite, or `anywherellm-suite pages`." })));
      }
      const text = await res.text();
      if (text === last || busy()) return;
      last = text;
      now = JSON.parse(text);
      if (now.result && toldAt !== null && now.result.n !== toldAt) toast(now.result.error ?? now.result.title.replace(/^./, (ch) => ch.toUpperCase()));
      toldAt = now.result ? now.result.n : 0;
      draw();
      if (first) {
        first = false;
        const ws = new URLSearchParams(location.hash.slice(1)).get("ws");
        if (ws && !opened) [...document.querySelectorAll("[data-ws]")].find((l) => l.dataset.ws === ws)?.scrollIntoView({ block: "start" });
      }
    } catch (e) {
      toast("Can't reach AnythingLLM");
    }
  }
  head(null);
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
