  const CLOSE = "M4 4l8 8M12 4l-8 8", BACK = "M10 3.5 5.5 8l4.5 4.5", CHECK = "M3.5 8.5l3 3 6-7", BIN = "M2.5 4.5h11 M6.2 4.5V2.8h3.6v1.7 M4 4.5l.7 8.7h6.6l.7-8.7",
    OPEN = "M9.5 2.5h4v4 M13.5 2.5 7.5 8.5 M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3", PEN = "M10.5 2.8l2.7 2.7L6 12.7l-3.5.8.8-3.5z", CLOCK = "M2.8 8a5.2 5.2 0 1 0 1.5-3.7 M2.5 2.5v2.3h2.3 M8 5.2V8l2 1.3";
  const dots = () => { const s = icon("", 18); s.setAttribute("fill", "currentColor"); s.innerHTML = '<circle cx="3.5" cy="8" r="0.9"/><circle cx="8" cy="8" r="0.9"/><circle cx="12.5" cy="8" r="0.9"/>'; return s; };
  const initial = (title) => (title.trim()[0] || "?").toUpperCase();

  // ---- The toast: what was sent or done, or a refusal; with `undo`, an Undo button while it shows.
  let toastTimer = 0;
  function toast(text, undo = null, ms = 4000) {
    const box = $("toast"), button = box.querySelector("button");
    box.querySelector("span").textContent = text;
    button.hidden = !undo;
    button.onclick = () => { box.hidden = true; undo?.(); };
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (box.hidden = true), ms);
  }

  // ---- Posting: each thing done here is an event under the manager's title, posted through
  // AnythingLLM's upload, which the apps skill applies.
  async function post(ev, fields = {}) {
    const event = { apps_lean_manage: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: cfg.title, docSource: "apps-lean manager" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages’ key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + res.status), false;
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can’t reach AnythingLLM");
      return false;
    }
  }

  // ---- The sheet: one at a time over the page, as on the Vault: `kids` in its `kind` of box, the
  // heading `head` names it; closing it gives the focus back to `from`.
  let asking = null;
  function sheet(kind, head, kids, from) {
    asking?.close();
    const shade = [...document.querySelectorAll("body > header, body > main, body > footer")];
    const was = shade.map((part) => part.inert);
    const scrim = el("div", { className: "scrim" });
    const box = el("section", { className: "sheet" }, el("span", { className: "grip" }), el("div", { className: kind }, ...kids));
    for (const [k, v] of [["role", "dialog"], ["aria-modal", "true"], ["aria-labelledby", head.id = "q" + Math.random().toString(36).slice(2, 8)]]) box.setAttribute(k, v);
    const me = {
      close: () => {
        if (asking !== me) return;
        asking = null;
        scrim.remove(), box.remove();
        shade.forEach((part, i) => (part.inert = was[i]));
        if (from.isConnected) from.focus();
      },
    };
    scrim.onclick = me.close;
    for (const part of shade) part.inert = true;
    document.body.append(scrim, box);
    return (asking = me);
  }

  // One question: `body` goes between it and its two buttons; `yes` runs with what `value` reads,
  // unless `from` was drawn away.
  function ask({ title, line, yes, danger = true, body = null, value = () => null }, run, from) {
    const keep = el("button", { className: danger ? "keep" : "keep soft", type: "button", textContent: "Keep" });
    const go = el("button", { className: danger ? "go" : "yes", type: "button", textContent: yes });
    const head = el("h2", { textContent: title });
    const me = sheet("q", head, [el("div", {}, head, line ? el("p", { textContent: line }) : null), body, el("div", { className: "two" }, keep, go)], from);
    keep.onclick = me.close;
    go.onclick = () => {
      const live = from.isConnected, v = value();
      if (v === false) return;
      me.close();
      if (live) run(v);
    };
    (body?.querySelector("input") ?? keep).focus();
  }

  // ---- What the state says, as people read it.
  const WHO = { page: "on the page", agent: "by the agent", job: "by a scheduled job" };
  // Times as the boards say them: "2 min ago" this past hour, "09:12" earlier today, then "yesterday",
  // "Monday" in the week before, "18 Oct" before that; `long` adds the time to the last three
  // ("Monday 06:00"). A version's time is said in full: "20 Oct, 14:02".
  const hm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const dayOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const date = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  const when = (t, long = false) => {
    const d = new Date(t);
    if (isNaN(d)) return "";
    const mins = Math.floor((Date.now() - d) / 60000);
    if (mins < 60) return mins < 1 ? "just now" : `${mins} min ago`;
    const days = Math.round((dayOf(new Date()) - dayOf(d)) / 86400000);
    if (days < 1) return hm(d);
    if (days === 1) return long ? `yesterday ${hm(d)}` : "yesterday";
    if (days < 7) return d.toLocaleDateString("en-GB", { weekday: "long" }) + (long ? ` ${hm(d)}` : "");
    return date(d) + (long ? `, ${hm(d)}` : "");
  };
  const at = (t) => { const d = new Date(t); return isNaN(d) ? "" : `${date(d)}, ${hm(d)}`; };
  const changeText = (c) => `${c.ev}${c.text ? `: ${c.text}` : ""}`;
  const daysLeft = (until) => Math.max(0, Math.ceil((Date.parse(until) - Date.now()) / 86400000));
  // The theme this page has now (a client may switch it while it's open), at the moment the link is followed.
  const pageHref = (page) => { const now = document.documentElement.dataset.theme; return page + (now === "light" || now === "dark" ? `?theme=${now}` : ""); };

  // ---- Views: the apps (all, or one workspace's), the trash, or one app; the last two are entries
  // of the browser's history, so Back returns to the apps.
  let now = null, view = history.state ?? {}, ws = new URLSearchParams(location.hash.slice(1)).get("ws") || "all", forward = false;
  const find = (key) => { for (const w of now?.workspaces ?? []) for (const a of w.apps) if (`${w.workspace}/${a.name}` === key) return { workspace: w.workspace, app: a }; return null; };
  // Every app, newest first; the workspace chosen, or all where it has none now.
  const everyApp = () => now.workspaces.flatMap((w) => w.apps.map((a) => ({ workspace: w.workspace, app: a }))).sort((p, q) => (q.app.changed > p.app.changed) - (q.app.changed < p.app.changed));
  const chosen = () => (now.workspaces.some((w) => w.workspace === ws) ? ws : "all");
  const count = (n) => `${n} app${n === 1 ? "" : "s"}`;

  function head(one) {
    const deep = !!(one || view.trash), sub = $("sub");
    $("close").replaceChildren(icon(deep ? BACK : CLOSE));
    $("close").classList.toggle("back", deep);
    $("close").setAttribute("aria-label", deep ? "Back to Apps" : "Close");
    $("title").textContent = one ? one.app.title : view.trash ? "Trash" : "Apps";
    sub.classList.toggle("mono", !!one);
    const shown = chosen(), n = everyApp().filter((x) => shown === "all" || x.workspace === shown).length;
    sub.textContent = one ? `${one.workspace} · ${one.app.name}` : view.trash ? count(now.trash.length) : `${shown === "all" ? "All" : shown} · ${count(n)} · newest first`;
    sub.hidden = !sub.textContent;
    for (const id of ["bin", "chips", "apps", "foot"]) $(id).hidden = deep;
    if (!deep) $("chips").hidden = now.workspaces.length < 2;
    $("trash").hidden = !view.trash || !!one;
    $("one").hidden = !one;
  }

  function draw() {
    if (!now) return;
    const one = view.app && find(view.app);
    if (view.app && !one) return back();
    drawApps();
    drawTrash();
    head(one);
    if (one) drawOne(one);
  }

  function drawApps() {
    const all = everyApp(), shown = chosen(), apps = all.filter((x) => shown === "all" || x.workspace === shown);
    const chip = (key, label, n) => {
      const on = key === shown, b = el("button", { type: "button", ariaPressed: String(on), ariaLabel: `${label}, ${count(n)}`, onclick: () => pick(key) }, on ? icon(CHECK, 16) : null, label);
      b.dataset.ws = key;
      return b;
    };
    $("chips").replaceChildren(chip("all", "All", all.length), ...now.workspaces.map((w) => chip(w.workspace, w.workspace, w.apps.length)));
    const tiles = apps.map(({ workspace, app: a }) => {
      const key = `${workspace}/${a.name}`, time = when(a.changed), where = shown === "all" ? [workspace, time].filter(Boolean).join(" · ") : time;
      const open = el("button", { className: "open", type: "button", ariaLabel: `${a.title}, ${workspace}${a.summary ? `: ${a.summary}` : ""}${time ? ` · ${time}` : ""}`, onclick: () => openApp(key) },
        el("span", { className: "chip", ariaHidden: "true", textContent: initial(a.title) }),
        el("span", { className: "who" }, el("b", { textContent: a.title }), a.summary ? el("small", { textContent: a.summary }) : null, where ? el("small", { textContent: where }) : null));
      open.dataset.key = key;
      const more = el("button", { className: "more", type: "button", ariaLabel: `More for ${a.title}` }, dots());
      more.onclick = () => actions({ workspace, app: a }, more);
      return el("li", { className: "tile" }, open, more);
    });
    const list = el("ul", { className: "grid" }, ...tiles);
    list.setAttribute("aria-label", `${shown === "all" ? "All apps" : `${shown} apps`}, newest first`);
    $("apps").replaceChildren(tiles.length ? list : el("div", { className: "card" }, el("p", { className: "empty", textContent: "No apps yet. Ask the agent in a chat to make one." })));
  }

  function pick(key) {
    ws = key;
    history.replaceState(history.state, "", key === "all" ? location.pathname + location.search : `#ws=${encodeURIComponent(key)}`);
    draw();
    [...$("chips").children].find((b) => b.dataset.ws === key)?.focus();
  }

  function drawTrash() {
    $("bin").replaceChildren(icon(BIN, 16), `Trash · ${now.trash.length}`);
    $("bin").setAttribute("aria-label", `Trash, ${count(now.trash.length)}`);
    const rows = now.trash.map((x) => {
      const left = daysLeft(x.until);
      return el("div", { className: "row" }, el("div", { className: "who" }, el("b", { textContent: x.title }), el("small", { textContent: `${x.workspace} · ${left} day${left === 1 ? "" : "s"} left` })),
        el("button", { className: "act", type: "button", textContent: "Restore", ariaLabel: `Restore ${x.title}`, onclick: () => post("restore", { id: x.id, title: x.title }) && toast("Restoring " + x.title) }));
    });
    $("trash").replaceChildren(el("p", { className: "lead", textContent: `Apps moved to the trash, each in its own workspace. Each stays ${now.trashDays} days, then it’s gone.` }),
      el("div", { className: "card" }, ...(rows.length ? rows : [el("p", { className: "empty", textContent: "The trash is empty." })])),
      el("p", { className: "cap", textContent: `The trash holds ${now.trashMax}. When it’s full, a delete is refused until one goes, rather than drop one early.` }));
  }

  /** A take back waits this long before it's posted, so Undo can cancel it with nothing sent. */
  const HOLD_MS = 5000;
  let held = null;
  function takeBack(one, c) {
    if (held) clearTimeout(held.timer), held.send();
    const fields = { workspace: one.workspace, app: one.app.name, n: c.n, title: one.app.title };
    held = { send: () => { held = null; post("take-back", fields); }, timer: 0 };
    held.timer = setTimeout(held.send, HOLD_MS);
    toast(`Taken back: ${changeText(c)}`, () => { clearTimeout(held?.timer); held = null; }, HOLD_MS);
  }

  const baseOf = ({ workspace, app }) => ({ workspace, app: app.name, title: app.title });
  const openPage = (app, ...label) => el("a", { className: "btn pri", href: pageHref(app.page), onclick() { this.href = pageHref(app.page); } }, ...label);

  function rename(one, from) {
    const { app } = one;
    const input = el("input", { className: "fld", type: "text", value: app.title, maxLength: 80, autocomplete: "off" });
    ask({ title: `Rename ${app.title}`, yes: "Rename", danger: false,
      body: el("div", {}, el("label", {}, "Title", input), el("p", { className: "cap", style: "padding:12px 0 0" }, "Its name, ", el("span", { className: "mono", textContent: app.name }), ", stays: the agent and its scheduled jobs call it by that.")),
      value: () => { const v = input.value.trim(); if (!v) return toast("Give it a title"), false; return v; } },
      (title) => title !== app.title && post("rename", { ...baseOf(one), title }), from);
  }

  function toTrash(one, from) {
    ask({ title: `Move ${one.app.title} to the trash?`, line: `It stays there ${now.trashDays} days, and Restore brings it back until then. Its page stops working, and the agent and its scheduled jobs can’t use it meanwhile.`, yes: "Move to trash" },
      async () => { if ((await post("trash", baseOf(one))) && view.app) back(); }, from);
  }

  // ---- An app's actions, over the apps: its page, rename, its history, its last change taken back, the trash.
  function actions(one, from) {
    const { workspace, app } = one, c = app.changes[0];
    const head = el("h2", { textContent: app.title });
    const shut = el("button", { className: "rb back", type: "button", ariaLabel: "Close" }, icon(CLOSE));
    const later = (fn) => () => { me.close(); fn(); };
    const me = sheet("acts", head, [
      el("div", { className: "hd" }, el("span", { className: "chip big", ariaHidden: "true", textContent: initial(app.title) }),
        el("div", { className: "name" }, head, el("small", { textContent: `${workspace} · ${app.name}` })), shut),
      app.page ? openPage(app, icon(OPEN, 16), "Open the page") : el("p", { className: "cap", style: "padding:0", textContent: "It has no page yet: the agent makes one when it builds the app." }),
      el("div", { className: "pair" },
        el("button", { className: "btn", type: "button", onclick: () => rename(one, from) }, icon(PEN, 16), "Rename"),
        el("button", { className: "btn", type: "button", ariaLabel: "History: changes and earlier versions", onclick: later(() => openApp(`${workspace}/${app.name}`)) }, icon(CLOCK, 16), "History")),
      c ? el("div", { className: "last" },
        el("div", { className: "who" }, el("small", { textContent: "Last change" }), el("b", { textContent: changeText(c) }), el("small", { textContent: `${when(c.t)} · ${WHO[c.by] ?? c.by}` })),
        el("button", { className: "act", type: "button", textContent: "Take back", ariaLabel: `Take back: ${changeText(c)}`, onclick: later(() => takeBack(one, c)) })) : null,
      el("div", { className: "stack" }, el("button", { className: "btn bad", type: "button", onclick: () => toTrash(one, from) }, icon(BIN, 16), "Move to trash"),
        el("p", { className: "cap", textContent: `It stays in the trash ${now.trashDays} days, and can be restored from there.` })),
    ], from);
    shut.onclick = me.close;
    shut.focus();
  }

  function drawOne(one) {
    const { app } = one;
    const base = baseOf(one);
    const renameButton = el("button", { className: "btn", type: "button", textContent: "Rename" });
    renameButton.onclick = () => rename(one, renameButton);
    const open = app.page ? openPage(app, "Open the page") : null;
    const top = el("div", { className: "card solo" }, app.summary ? el("p", { className: "sum", textContent: app.summary }) : null,
      app.page ? null : el("p", { className: "cap", style: "padding:0", textContent: "It has no page yet: the agent makes one when it builds the app." }),
      el("div", { className: "pair" }, open, renameButton));
    const changes = app.changes.map((c, i) => el("div", { className: "row" },
      el("div", { className: "who" }, el("b", { textContent: changeText(c) }), el("small", { textContent: `${when(c.t, true)} · ${WHO[c.by] ?? c.by}` })),
      i === 0 ? el("button", { className: "act", type: "button", textContent: "Take back", ariaLabel: `Take back: ${changeText(c)}`, onclick: () => takeBack(one, c) }) : null));
    const versions = app.versions.map((v, made = at(v.t)) => el("div", { className: "row" },
      el("div", { className: "who" }, el("b", { className: "mono", textContent: v.file }), el("small", { textContent: made })),
      el("button", { className: "act", type: "button", textContent: "Put back", ariaLabel: `Put back ${v.file} from ${made}`, onclick: () => post("put-back", { ...base, file: v.file, at: v.t }) && toast(`Putting back ${v.file}`) })));
    const trash = el("button", { className: "btn bad", type: "button", style: "align-self:flex-start", textContent: "Move to trash" });
    trash.onclick = () => toTrash(one, trash);
    $("one").replaceChildren(top,
      el("div", { className: "lab", textContent: "Recent changes" }),
      el("div", { className: "card" }, ...(changes.length ? changes : [el("p", { className: "empty", textContent: "No changes yet." })])),
      el("p", { className: "cap", textContent: "The last 20 are kept. Only the newest can be taken back." }),
      el("div", { className: "lab", textContent: "Earlier versions" }),
      el("div", { className: "card" }, ...(versions.length ? versions : [el("p", { className: "empty", textContent: "No earlier versions yet." })])),
      el("p", { className: "cap", textContent: "The last 10 versions of its page and its definition. Putting one back is a change too, so it can be taken back." }),
      trash);
  }

  const deep = (state) => !!(state?.app || state?.trash);
  function show(state) {
    const was = view;
    view = state ?? {};
    draw();
    if (deep(view)) window.scrollTo(0, 0), $("close").focus();
    else if (was.app) [...$("apps").querySelectorAll(".open")].find((b) => b.dataset.key === was.app)?.focus();
    else if (was.trash) $("bin").focus();
  }
  function go(state) {
    history.pushState(state, "");
    forward = false;
    show(state);
  }
  const openApp = (key) => go({ app: key });
  function back() {
    if (deep(history.state)) history.back();
    else show(null);
  }
  window.addEventListener("popstate", (e) => { asking?.close(); forward = !deep(e.state); show(e.state); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !(asking || deep(view))) return;
    e.preventDefault();
    asking ? asking.close() : back();
  });
  $("close").onclick = () => (deep(view) ? back() : history.length - (forward ? 1 : 0) > 1 ? history.back() : window.close());
  $("bin").onclick = () => go({ trash: true });

  // ---- A new link, asked first.
  const rotate = el("button", { className: "btn", type: "button", textContent: "New link" });
  rotate.onclick = () => ask({ title: "Make a new link?", line: "This one stops working, everywhere it was shared.", yes: "Make it" }, () => post("rotate"), rotate);
  $("foot").querySelector("div").append(rotate);

  // ---- The state, every few seconds; not drawn again under a question or a field being typed in.
  // What the skill did with the last event shows once, as a toast.
  let last = null, drawnAt = null, toldAt = null;
  const busy = () => !!asking || document.activeElement?.tagName === "INPUT";
  async function load() {
    try {
      const res = await fetch(`${cfg.token}.json`, { cache: "no-cache" });
      if (res.status === 404) {
        clearInterval(poll); // the link is gone for good: said once
        view = {};
        for (const id of ["bin", "chips", "foot", "trash", "one"]) $(id).hidden = true;
        $("apps").hidden = false;
        const gone = el("div", { className: "card solo gone", role: "status" }, el("b", { style: "font-weight:600", textContent: "This link was replaced" }),
          el("p", { className: "sum" }, "Open the page again from where you got it: the agent, AnywhereLLM Lite, or ", el("span", { className: "mono", textContent: "anywherellm-suite pages" }), "."));
        return $("apps").replaceChildren(gone);
      }
      if (!res.ok) throw new Error(res.status);
      const text = await res.text();
      const minute = Math.floor(Date.now() / 60000); // "2 min ago" moves on with no change
      if ((text === last && minute === drawnAt) || busy()) return;
      last = text;
      drawnAt = minute;
      now = JSON.parse(text);
      if (now.result && toldAt !== null && now.result.n !== toldAt) {
        const { title, error } = now.result;
        toast(error || title.replace(/^./, (ch) => ch.toUpperCase()));
      }
      toldAt = now.result ? now.result.n : 0;
      draw();
    } catch (e) {
      toast("Can’t reach AnythingLLM");
    }
  }
  const poll = setInterval(load, 5000);
  load();
})();
</script>
</body>
</html>
