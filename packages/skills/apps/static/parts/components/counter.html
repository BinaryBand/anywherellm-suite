<!--part
{"name":"counter","line":"a number stepped toward a target","schema":{"type":"object","required":["count","target"],"properties":{"count":{"type":"integer","minimum":0,"maximum":100000},"target":{"type":"integer","minimum":1,"maximum":100000}}},"data":{"count":3,"target":8},"events":["step"]}
-->
<div class="card stack center" data-part="counter">
<div class="dial" data-ref="meter" role="progressbar" aria-label="Toward the target" aria-valuemin="0"><output class="big" data-ref="count"></output></div>
<small data-ref="of"></small>
<div class="row"><button type="button" data-ref="less" aria-label="One less">−</button><button type="button" class="primary halo" data-ref="more" aria-label="One more">+</button></div>
</div>
<script>
App.mount("counter", ({ at, q }) => {
  const step = (by) => {
    const count = App.get(at + "/count");
    App.patch([{ op: "test", path: at + "/count", value: count },
      { op: "replace", path: at + "/count", value: Math.max(0, count + by) }], { ev: "step", change: by });
  };
  q("less").onclick = () => step(-1);
  q("more").onclick = () => step(1);
  return () => {
    const { count, target } = App.get(at);
    q("count").textContent = count;
    const m = q("meter"), done = Math.min(count, target);
    m.style.setProperty("--p", (done / target) * 100);
    m.setAttribute("aria-valuemax", target);
    m.setAttribute("aria-valuenow", done);
    q("of").textContent = `${count} of ${target}`;
  };
});
</script>
