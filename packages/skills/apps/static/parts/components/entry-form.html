<!--part
{"name":"entry-form","line":"a form adding dated entries","schema":{"type":"object","required":["entries"],"properties":{"entries":{"type":"array","maxItems":2000,"items":{"type":"object","required":["text","at"],"properties":{"text":{"type":"string","maxLength":500},"at":{"type":"string","maxLength":40}}}}}},"data":{"entries":[]},"events":["add"]}
-->
<div class="stack wide" data-part="entry-form">
<form class="stack" data-ref="form"><label class="field">Note<textarea data-ref="text" maxlength="500" required></textarea></label><button type="submit">Add</button></form>
<ul class="items" data-ref="entries"></ul>
<p class="empty" data-ref="none">Nothing written yet. Your first note goes above.</p>
</div>
<script>
App.mount("entry-form", ({ at, q }) => {
  q("form").onsubmit = (e) => {
    e.preventDefault();
    const text = q("text").value.trim();
    if (text) App.patch([{ op: "add", path: at + "/entries/-", value: { text, at: new Date().toISOString() } }], { ev: "add", text }), App.cue(q("entries").firstElementChild, "added");
    q("text").value = "";
  };
  return () => {
    const entries = App.get(at + "/entries");
    q("none").hidden = entries.length > 0;
    q("entries").replaceChildren(...entries.slice(-20).reverse().map((e) => {
      const li = el("li");
      li.append(el("span", { textContent: e.text }), el("small", { textContent: e.at.slice(0, 10) }));
      return li;
    }));
  };
});
</script>
