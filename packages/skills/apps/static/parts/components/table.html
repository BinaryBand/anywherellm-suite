<!--part
{"name":"table","line":"rows to sort, filter and edit in place: a sheet, a log","schema":{"type":"object","required":["columns","rows"],"properties":{"columns":{"type":"array","minItems":1,"maxItems":12,"items":{"type":"object","required":["key","label"],"properties":{"key":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,39}$"},"label":{"type":"string","minLength":1,"maxLength":40},"type":{"enum":["text","number","date"]}}}},"rows":{"type":"array","maxItems":1000,"items":{"type":"object"}}}},"data":{"columns":[{"key":"item","label":"Item"},{"key":"amount","label":"Amount","type":"number"}],"rows":[]},"events":["edit","add-row","remove-row"]}
-->
<div class="stack wide" data-part="table">
<input type="search" data-ref="filter" placeholder="Filter" aria-label="Filter the rows">
<div class="scroll"><table><thead><tr data-ref="head"></tr></thead><tbody data-ref="rows"></tbody></table></div>
<p class="empty" data-ref="none">No rows yet. Add the first one.</p>
<button type="button" data-ref="add">Add a row</button>
</div>
<script>
App.mount("table", ({ at, q }) => {
  let key = null, up = true, find = ""; // the page's own view, never saved
  const show = (c, v) => (v ?? "") === "" ? "" : c.type === "number" ? Number(v).toLocaleString() : String(v);
  const btn = (text, label, fn) => el("button", { type: "button", className: "quiet", textContent: text, ariaLabel: label, onclick: fn });
  const guard = (i, row) => ({ op: "test", path: `${at}/rows/${i}`, value: row });
  q("filter").oninput = () => ((find = q("filter").value.trim().toLowerCase()), draw());
  q("add").onclick = () => App.patch([{ op: "add", path: at + "/rows/-", value: Object.fromEntries(App.get(at + "/columns").map((c) => [c.key, c.type === "number" ? 0 : ""])) }], { ev: "add-row" });
  function edit(td, i, row, c) {
    const input = el("input", { value: row[c.key] ?? "", ariaLabel: c.label, type: c.type === "date" ? "date" : "text", inputMode: c.type === "number" ? "decimal" : "text" });
    const done = (save) => {
      const v = c.type === "number" ? Number(input.value.replace(/[^0-9.+-]/g, "")) : input.value.trim();
      if (save && v !== row[c.key] && !Number.isNaN(v)) App.patch([guard(i, row), { op: "add", path: `${at}/rows/${i}/${c.key}`, value: v }], { ev: "edit", column: c.key });
      else draw();
    };
    input.onkeydown = (e) => (e.key === "Enter" ? done(true) : e.key === "Escape" ? done(false) : 0);
    input.onblur = () => done(true);
    td.replaceChildren(input);
    input.focus();
  }
  function draw() {
    const { columns, rows } = App.get(at);
    q("head").replaceChildren(...columns.map((c) => {
      const th = el("th", { scope: "col" });
      th.setAttribute("aria-sort", key === c.key ? (up ? "ascending" : "descending") : "none");
      th.append(btn(c.label + (key === c.key ? (up ? " ↑" : " ↓") : ""), "Sort by " + c.label, () => ((up = key === c.key ? !up : c.type !== "number"), (key = c.key), draw())));
      return th;
    }), el("th"));
    const sorter = columns.find((c) => c.key === key);
    const shown = rows.map((row, i) => ({ row, i }))
      .filter(({ row }) => !find || columns.some((c) => show(c, row[c.key]).toLowerCase().includes(find)))
      .sort((a, b) => !sorter ? 0 : (up ? 1 : -1) * (sorter.type === "number" ? (+a.row[key] || 0) - (+b.row[key] || 0) : String(a.row[key] ?? "").localeCompare(String(b.row[key] ?? ""))));
    q("none").hidden = rows.length > 0;
    q("rows").replaceChildren(...shown.map(({ row, i }) => {
      const tr = el("tr");
      const cell = (b) => { const td = el("td"); td.append(b(td)); tr.append(td); };
      for (const c of columns) {
        const text = show(c, row[c.key]);
        cell((td) => btn(text || "—", `${c.label}: ${text || "empty"}, edit`, () => edit(td, i, row, c)));
      }
      cell(() => btn("✕", "Remove this row", () => App.patch([guard(i, row), { op: "remove", path: `${at}/rows/${i}` }], { ev: "remove-row" })));
      return tr;
    }));
  }
  return draw;
});
</script>
