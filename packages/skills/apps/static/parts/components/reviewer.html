<!--part
{"name":"reviewer","line":"flashcards: flip, then grade","schema":{"type":"object","required":["cards"],"properties":{"cards":{"type":"array","maxItems":1000,"items":{"type":"object","required":["front","back","seen","right"],"properties":{"front":{"type":"string","maxLength":300},"back":{"type":"string","maxLength":300},"seen":{"type":"integer","minimum":0},"right":{"type":"integer","minimum":0}}}}}},"data":{"cards":[{"front":"tack","back":"thanks","seen":0,"right":0}]},"events":["review"]}
-->
<div class="stack wide" data-part="reviewer">
<button type="button" class="card flip" data-ref="card"></button>
<div class="row" data-ref="grade"><button class="grow" data-ref="again">Again</button><button class="primary grow" data-ref="right">Got it</button></div>
<p class="empty" data-ref="none">No cards yet.</p>
</div>
<script>
App.mount("reviewer", ({ at, q }) => {
  let i = 0, back = false;
  const draw = () => {
    const all = App.get(at + "/cards"), n = all.length, c = all[i % (n || 1)];
    q("none").hidden = n > 0;
    q("card").hidden = !n;
    q("grade").hidden = !n || !back;
    if (c) q("card").textContent = back ? c.back : c.front;
  };
  q("card").onclick = () => { back = !back; draw(); App.cue(q("card"), "reveal"); };
  const grade = (ok) => {
    const all = App.get(at + "/cards"), k = i++ % all.length, c = all[k], p = `${at}/cards/${k}/`;
    back = false;
    App.patch([{ op: "test", path: p + "front", value: c.front }, { op: "replace", path: p + "seen", value: c.seen + 1 },
      { op: "replace", path: p + "right", value: c.right + ok }], { ev: "review", card: c.front, ok: !!ok });
  };
  q("again").onclick = () => grade(0);
  q("right").onclick = () => (grade(1), App.cue(q("card"), "success"));
  return draw;
});
</script>
