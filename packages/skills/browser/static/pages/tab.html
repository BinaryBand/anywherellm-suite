    const key = await crypto.subtle.importKey("raw", aes, "AES-GCM", false, ["encrypt"]);
    const sealed = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
    return ["h1", b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, aes)), b64(iv), b64(sealed)].join(".");
  }

  let toastTimer = 0;
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ($("toast").hidden = true), 2600);
  }

  // ---- The picture, fitted between the controls, measured on each resize.
  function reserve() {
    top = Math.round($("top").getBoundingClientRect().bottom) + 8;
    const row = [$("hint"), $("mine")].find((b) => !b.hidden);
    bottom = !host && row ? Math.round(innerHeight - row.getBoundingClientRect().top) + 8 : 0;
    $("upd").style.top = top + "px";
    $("toast").style.bottom = bottom + 16 + "px";
  }
  function layout() {
    if (!st) return;
    const W = innerWidth, H = Math.max(1, innerHeight - top - bottom);
    scale = Math.min(W / size.w, H / size.h);
    left = (W - size.w * scale) / 2;
    Object.assign($("shot").style, { width: size.w * scale + "px", height: size.h * scale + "px", left: left + "px", top: top + "px" });
    if (over) place(over.input, over.field);
  }
  addEventListener("resize", () => (reserve(), layout(), askSize()));

  // ---- The tab's screen: this window's room between the controls, asked for once it settles; the
  // skill keeps it within the screens it draws.
  let sizeTimer = 0, asked = null;
  function askSize() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(() => {
      if (!st) return;
      const want = { w: innerWidth, h: innerHeight - top - bottom, dpr: devicePixelRatio || 1 };
      const have = asked || size;
      if (Math.abs(want.w - have.w) <= 8 && Math.abs(want.h - have.h) <= 8 && (!asked || want.dpr === asked.dpr)) return;
      asked = want;
      post("size", want);
    }, 500);
  }
  const toPage = (e) => ({ x: Math.round((e.clientX - left) / scale), y: Math.round((e.clientY - top) / scale) });
  const inside = (p, f) => p.x >= f.x && p.x <= f.x + f.w && p.y >= f.y && p.y <= f.y + f.h;

  // ---- Typing: a real input over the field the user tapped, so this device's keyboard opens.
  function place(input, f) {
    Object.assign(input.style, { left: left + f.x * scale + "px", top: top + f.y * scale + "px", width: Math.max(f.w * scale, 120) + "px", height: Math.max(f.h * scale, 40) + "px" });
  }
  const KINDS = new Set(["email", "password", "tel", "url", "search", "date", "time", "month", "week", "datetime-local"]);
  function nextField(f) {
    const after = (st.fields || []).filter((g) => g.ref !== f.ref && (g.y > f.y + 2 || (Math.abs(g.y - f.y) <= 2 && g.x > f.x)));
    return after.sort((a, b) => a.y - b.y || a.x - b.x)[0] || null;
  }
  function openField(f) {
    closeField(false);
    const input = el("input", { className: "over", type: KINDS.has(f.kind) ? f.kind : "text", autocomplete: f.kind === "password" ? "new-password" : "off", autocapitalize: "off", spellcheck: false, placeholder: f.filled ? "Type to replace" : "" });
    if (f.kind === "number") input.inputMode = "decimal";
    input.setAttribute("aria-label", f.kind === "password" ? "Password" : "Field on the page");
    input.enterKeyHint = nextField(f) ? "next" : "go";
    place(input, f);
    $("stage").appendChild(input);
    over = { input, field: f };
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const goNext = input.enterKeyHint === "next" && nextField(f);
      send(f, input.value, goNext ? "Tab" : "Enter");
      if (goNext) openField(goNext);
      else closeField(false);
    });
    input.addEventListener("blur", () => setTimeout(() => over && over.input === input && closeField(true), 0));
    input.focus();
  }
  function closeField(keep) {
    if (!over) return;
    const { input, field: f } = over;
    over = null;
    if (keep && input.value) send(f, input.value, null);
    input.remove();
  }
  async function send(f, value, then) {
    if (f.kind !== "password") return post("type", { ref: f.ref, text: value, then });
    try {
      return post("type", { ref: f.ref, sealed: await seal(value), then });
    } catch (e) {
      toast(e.message);
    }
  }

  // ---- Taps and swipes on the picture, each shown at once: a ripple where the finger lands, and
  // the picture following a swipe until the scrolled one comes.
  let down = null, slid = 0;
  const onPicture = (e) => e.target === $("stage") || e.target === $("shot") || e.target === $("take");
  const mine = () => st && st.who === "user";
  function ripple(e) {
    const dot = el("span", { className: "tap" });
    Object.assign(dot.style, { left: e.clientX + "px", top: e.clientY + "px" });
    dot.addEventListener("animationend", () => dot.remove());
    $("stage").appendChild(dot);
  }
  function slide(dy) {
    clearTimeout(slid);
    $("shot").style.transform = dy ? `translateY(${dy}px)` : "";
  }
  const isSwipe = (dx, dy) => Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx);
  $("stage").addEventListener("pointerdown", (e) => {
    if (!onPicture(e)) return;
    down = { x: e.clientX, y: e.clientY };
    ripple(e);
  });
  $("stage").addEventListener("pointermove", (e) => {
    if (!down || !mine()) return;
    const dy = e.clientY - down.y;
    if (isSwipe(e.clientX - down.x, dy)) slide(Math.max(-size.h * scale, Math.min(size.h * scale, dy)));
  });
  $("stage").addEventListener("pointerup", (e) => {
    const d = down;
    down = null;
    if (!d || !mine()) return;
    const dy = e.clientY - d.y;
    swiped = isSwipe(e.clientX - d.x, dy);
    if (!swiped) return slide(0);
    post("scroll", { dy: Math.round(-dy / scale) });
    slid = setTimeout(() => slide(0), 3000); // no picture came: put it back
  });
  // A tap on the picture: a field opens for typing, anything else is tapped in the tab.
  function tapAt(e) {
    const p = toPage(e);
    if (p.x < 0 || p.y < 0 || p.x > size.w || p.y > size.h) return;
    const f = (st.fields || []).find((g) => inside(p, g));
    if (f) return openField(f);
    closeField(true);
    post("tap", p);
  }
  $("stage").addEventListener("click", (e) => {
    if (swiped) return void (swiped = false);
    if (!mine() || e.target === $("take") || !onPicture(e)) return;
    tapAt(e);
  });
  // Takes the tab over, shown at once; the state file catches up. The first tap is a tap too.
  function takeOver() {
    st.who = "user";
    paint();
    post("take");
    pending.who = "user";
  }
  $("take").addEventListener("click", (e) => {
    if (!st) return;
    takeOver();
    tapAt(e);
  });
  function give() {
    if (!mine()) return Promise.resolve();
    closeField(true);
    st.who = "agent";
    paint();
    const done = post("give");
    pending.who = "agent";
    return done;
  }
  $("give").addEventListener("click", give);
  $("navback").addEventListener("click", () => (closeField(true), post("nav", { do: "back" })));
  $("reload").addEventListener("click", () => (closeField(true), post("nav", { do: "reload" })));
  // AnywhereLLM Lite's bar hands the tab back through this, before it sends a message to the agent.
  window.browserLean = { give: () => give().then(() => host && host.postMessage('{"gave":true}')) };
  let told = null;
  const tell = (who) => host && who !== told && host.postMessage(JSON.stringify({ who: (told = who) }));
  $("back").addEventListener("click", () => (history.length > 1 ? history.back() : window.close()));
  // The saved logins are listed and deleted on the Vault page (library-lean's), on this same host.
  $("tk").addEventListener("click", () => st && st.vault && (closeField(true), location.assign(st.vault)));

  // ---- What the agent asked for: a login or a code, entered here and typed into the page for it.
  // While it's asked, the page opens on its form; `formFor` is the request the form was made for
  // (its `until`), so a new one, or one asked again, gets a form of its own.
  const remaining = () => (st && st.need ? Math.round((st.need.until - (Date.now() + skew)) / 1000) : 0);
  const asking = () => !!(st && st.need) && st.need.until !== dismissed && remaining() > 0;
  let ticker = 0;
  function tick() {
    if (!asking()) return paint();
    const s = remaining(), m = Math.round(s / 60);
    $("needleft").textContent = "The agent is waiting · " + (s < 60 ? "Less than a minute" : m === 1 ? "About a minute" : "About " + m + " minutes") + " left";
  }
  /** Builds the form for the request now asked; returns its first field. */
  function needForm() {
    const need = st.need;
    formFor = need.until;
    const login = need.kind === "login";
    // The words for what's asked: a new account's password (the user chooses it), a login, a code.
    const says = login && need.confirm ? { title: "Choose a password for " + need.host, secret: "New password", go: "Create" }
      : login ? { title: "Sign in to " + need.host, secret: "Password", go: "Sign in" }
      : { title: need.label || "Enter the code", secret: need.label || "Code", go: "Send" };
    let keep = true;
    const user = login && need.hasUser ? el("input", { className: "fld", autocapitalize: "off", autocomplete: "off", spellcheck: false }) : null;
    const secret = el("input", { className: "fld", type: login ? "password" : "text", autocomplete: login ? "new-password" : "one-time-code", autocapitalize: "off" });
    const sw = el("button", { className: "sw", role: "switch" }, el("span"));
    sw.setAttribute("aria-checked", "true");
    sw.setAttribute("aria-label", "Save this login for next time");
    sw.onclick = () => sw.setAttribute("aria-checked", String((keep = !keep)));
    // Answered, turned down or taken over: this request is done here, and doesn't come back.
    const done = () => (dismissed = need.until);
    const no = el("button", { className: "btn", textContent: "Cancel", onclick: () => (done(), post("need-cancel", { reason: "later" }), paint()) });
    const take = el("button", { className: "btn plain", id: "needtake", textContent: "Take over instead", onclick: () => (done(), post("need-cancel", { reason: "takeover" }), takeOver()) });
    const go = el("button", { className: "btn pri", textContent: says.go });
    go.onclick = async () => {
      if (user && !user.value.trim()) return toast("Give the username");
      if (!secret.value.trim()) return toast(login ? "Give the password" : "Give the code");
      let fields;
      try {
        fields = login ? { user: user ? user.value.trim() : "", sealed: await seal(secret.value), save: keep && !!user } : { text: secret.value.trim() };
      } catch (e) {
        return toast(e.message);
      }
      done();
      post("need-answer", fields);
      paint();
    };
    // The tab, small: for a code, the site often says there where it sent it.
    const thumb = el("figure", { className: "thumb" }, el("img", { id: "needshot", alt: "" }), el("figcaption", { className: "cap", textContent: "The tab" }));
    const live = el("span", { className: "live" });
    live.setAttribute("aria-hidden", "true");
    $("needform").replaceChildren(el("div", { className: "card form" }, thumb, el("b", { textContent: says.title }), el("p", { className: "cap", textContent: need.text }),
      field("Site", el("input", { className: "fld ro", value: need.host, readOnly: true })),
      ...(user ? [field("Username or email", user)] : []),
      field(says.secret, secret),
      ...(user ? [el("div", { className: "tgl" }, el("span", { textContent: "Save this login for next time" }), sw)] : []),
      el("p", { className: "cap", textContent: login ? "Sealed on this device before it’s sent, and typed into the page for the agent, which never sees it." : "Typed into the page for the agent, which never sees it." }),
      el("div", { className: "wait" }, live, el("span", { id: "needleft" })),
      el("div", { className: "row" }, no, go), take));
    return user || secret;
  }
  $("offerno").addEventListener("click", () => (($("offer").hidden = true), post("offer", { save: false })));
  $("offeryes").addEventListener("click", () => (($("offer").hidden = true), post("offer", { save: true })));

  // ---- Drawing what the state file says.
  function paint() {
    if (!st) return;
    const held = mine();
    document.body.classList.toggle("mine", held);
    // The request's form, over the page view.
    if (formFor && !asking()) {
      if (formFor !== dismissed) toast("That request is over");
      formFor = 0;
    }
    const ask = asking();
    $("needform").hidden = !ask;
    if (ask) {
      const first = formFor !== st.need.until && needForm();
      $("needshot").src = $("shot").src;
      tick();
      if (first) first.focus();
    }
    if (ask !== !!ticker) ticker = ask ? setInterval(tick, 1000) : (clearInterval(ticker), 0);
    document.body.classList.toggle("side", ask);
    $("who").textContent = held ? "You" : "Agent";
    $("addr").textContent = (st.url || "").replace(/^https?:\/\//, "");
    $("where").setAttribute("aria-label", (held ? "You have the tab" : "The agent has the tab") + ": " + (st.title || st.url));
    $("take").hidden = held;
    $("mine").hidden = !held;
    $("hint").hidden = held;
    tell(st.who);
    $("offer").hidden = !st.offer || ask;
    if (st.offer) {
      const passkey = st.offer.kind === "passkey";
      $("offerwhat").textContent = passkey ? "Save this passkey?" : "Save this login?";
      $("offerwho").textContent = st.offer.site + (st.offer.user ? " · " + st.offer.user : passkey ? " · passkey" : "");
    }
    $("tk").hidden = !st.vault;
    reserve();
    layout();
  }

  // The state file, asked for often while a step is pending and less when idle.
  async function poll() {
    if (document.hidden && st) return; // out of sight: no polling, but the first state still draws
    let next, text;
    try {
      const r = await fetch(cfg.token + ".json", { cache: "no-cache" });
      const d = Date.parse(r.headers.get("Date") || "");
      if (d) skew = d - Date.now();
      text = await r.text();
      next = JSON.parse(text);
    } catch (e) {
      return; // not reached, or not the state file: the next poll tries again
    }
    if (next.closed) {
      $("gone").hidden = false;
      return tell("agent");
    }
    $("gone").hidden = true;
    const same = text === lastText;
    if (!same) {
      const first = !st;
      st = next;
      if (st.shot !== shot) {
        const fresh = shot !== 0; // a message already there when the page opened isn't news
        shot = st.shot;
        slide(0);
        if (st.size) size = st.size;
        $("shot").src = cfg.token + ".jpg?v=" + shot;
        if (pending && shot !== pending.from) settled();
        if (st.msg && st.msg.id !== shown) (fresh && toast(st.msg.text)), (shown = st.msg.id); // a line stays a while: shown once
      }
      if (first) askSize(); // the first state: ask for this window's room
    }
    const was = st.who;
    if (pending && pending.who) st.who = pending.who; // taken or handed back here; the state file catches up
    // What a field being typed into would lose is drawn once it closes; the request's form is kept
    // while its request is.
    if ((!same || st.who !== was) && !over) (lastText = text), paint();
  }
  let pollTimer = 0;
  function loop() {
    poll().finally(() => {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(loop, pending ? 250 : 2000);
    });
  }
  function soon() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(loop, 250);
  }
  reserve();
  loop();
  document.addEventListener("visibilitychange", poll);
})();
</script>
</body>
</html>
