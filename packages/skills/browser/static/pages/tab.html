<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Browser</title>
<style>
/* The agent's browser tab: its picture between the controls at the top and the bottom, refreshed as
   it changes. Tap it to take it over; tap a field to type with this device's keyboard. The tab's
   screen follows the room between the controls, so it fills a phone or a desktop alike. Inside
   AnywhereLLM Lite, which draws its own bar for handing the tab back, the bottom row is left out.
   ?theme=light or dark keeps it to one, as the Vault's does. */
/* house tokens: AnywhereLLM Lite's colours (the design canvas's lite.css), the same in every page. Dark
   follows the device unless <html data-theme> is light or dark; high contrast follows prefers-contrast,
   and <html data-contrast> more or off forces it. */
:root{color-scheme:light dark;
--bg:light-dark(oklch(0.962 0.012 272),oklch(0.19 0.014 272));
--panel:light-dark(oklch(0.995 0.002 272),oklch(0.27 0.018 272));
--well:light-dark(oklch(0.94 0.016 272),oklch(0.31 0.02 272));
--page:light-dark(oklch(0.99 0 0),oklch(0.18 0.01 280));
--line:light-dark(oklch(0.89 0.014 272),oklch(0.4 0.022 272));
--line2:light-dark(oklch(0.925 0.012 272),oklch(0.33 0.02 272));
--ink:light-dark(oklch(0.25 0.03 272),oklch(0.94 0.01 272));
--ink2:light-dark(oklch(0.38 0.028 272),oklch(0.82 0.014 272));
--muted:light-dark(oklch(0.46 0.025 272),oklch(0.72 0.02 272));
--accent:light-dark(oklch(0.54 0.22 272),oklch(0.62 0.18 272));
--accentbg:light-dark(oklch(0.908 0.044 270),oklch(0.34 0.09 272));
--accentfg:light-dark(oklch(0.45 0.209 272),oklch(0.834 0.082 269));
--onaccent:light-dark(oklch(1 0 0),oklch(0.2 0.05 272));
--hover:light-dark(oklch(0.925 0.016 272),oklch(0.31 0.02 272));
--sel:light-dark(oklch(0.917 0.04 270),oklch(0.331 0.063 272));
--okfg:light-dark(oklch(0.468 0.083 184),oklch(0.801 0.12 185));
--okbg:light-dark(oklch(0.945 0.04 185),oklch(0.32 0.05 185));
--okdot:light-dark(oklch(0.628 0.111 184),oklch(0.726 0.128 184));
--warnfg:light-dark(oklch(0.529 0.119 64),oklch(0.83 0.12 65));
--warnbg:light-dark(oklch(0.944 0.039 66),oklch(0.319 0.05 65));
--badfg:light-dark(oklch(0.42 0.17 27),oklch(0.7 0.119 27));
--edge:light-dark(oklch(0.58 0.02 272),oklch(0.6 0.022 272));
--off:light-dark(oklch(0.84 0.012 272),oklch(0.42 0.02 272));
--bubble:light-dark(oklch(0.917 0.04 270),oklch(0.319 0.064 271));
--scrim:light-dark(oklch(0.25 0.03 272 / 0.4),oklch(0.1 0.02 272 / 0.6));
--shadow:light-dark(oklch(0.35 0.06 272 / 0.14),oklch(0.05 0.02 272 / 0.4));
--tileedge:transparent;
--hi:light-dark(transparent,oklch(1 0 0 / 0.06));
--sh0:light-dark(oklch(0.35 0.06 272 / 0.1),transparent);
--sh1:light-dark(oklch(0.35 0.06 272 / 0.08),transparent);
--sh2:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.4));
--sh3:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.3));
--tileshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh1),0 4px 8px var(--sh2),0 12px 24px var(--sh3);
--chipshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh0),0 4px 8px var(--sh2);
--fl1:light-dark(oklch(0.35 0.06 272 / 0.28),oklch(0 0 0 / 0.5));
--fl2:light-dark(oklch(0.35 0.06 272 / 0.16),oklch(0 0 0 / 0.3));
--float:0 12px 32px -8px var(--fl1),0 2px 6px var(--fl2);
--glow:0 8px 24px -4px color-mix(in oklab,var(--accent) 35%,transparent);
--sheetbg:var(--panel);
--sheetblur:none;
--sheetedge:transparent;
--sheethi:light-dark(oklch(1 0 0 / 0.7),oklch(1 0 0 / 0.1));
--meshA:light-dark(oklch(0.91 0.055 350),oklch(0.30 0.08 340));
--meshB:light-dark(oklch(0.89 0.07 295),oklch(0.32 0.10 295));
--meshC:light-dark(oklch(0.91 0.045 255),oklch(0.30 0.07 255))}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-contrast: more){:root:not([data-contrast="off"]){
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}}
:root[data-contrast="more"]{
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}
/* end of house tokens */
:root{--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,monospace}
/* density: the canvas's desktop boards size by the input, not the width. Touch sizes (44px controls,
   48px icon buttons, 56px rows) everywhere but where the only pointer is a mouse or trackpad. */
:root{--ctl:44px;--tap:48px;--row:56px}
@media (pointer:fine) and (hover:hover) and (not (any-pointer:coarse)){:root{--ctl:36px;--tap:36px;--row:40px}}
/* end of density */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input:focus-visible,#take:focus-visible{outline-offset:-3px}
[hidden],.hosted #hint,.hosted #mine{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
#shot{position:absolute;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none;background:#fff}
.mine #stage::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
#take{position:absolute;inset:0;width:100%;height:100%}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--accent);opacity:.3;pointer-events:none;animation:ripple .4s ease-out forwards}
@keyframes ripple{from{transform:scale(.4);opacity:.35}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.tap{animation:fade .3s forwards}@keyframes fade{to{opacity:0}}}
.over,.over:focus-visible{position:absolute;margin:0;border:0;outline:2px solid var(--accent);outline-offset:1px;border-radius:6px;background:#fff;color:#111;padding:0 8px;font-size:16px;box-shadow:var(--float)}
.top{position:fixed;left:0;right:0;top:0;z-index:3;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:center;gap:8px;pointer-events:none}.top>*{pointer-events:auto}
.fb,.tk{flex:none;background:var(--panel);color:var(--ink);display:flex;align-items:center;box-shadow:inset 0 0 0 1px var(--edge),var(--float)}
.fb{width:var(--tap);height:var(--tap);border-radius:50%;justify-content:center}
.where{flex:1;min-width:0;margin:0;min-height:40px;padding:0 14px;border-radius:99px;background:var(--panel);box-shadow:var(--float);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.where .u{min-width:0;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--okdot)}.mine .bdot{background:var(--ink)}
.tk{min-height:var(--ctl);padding:0 16px;border-radius:99px;font-size:15px;font-weight:600}
.upd{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:99px;background:var(--panel);box-shadow:var(--float);font-size:13px;font-weight:500;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.live{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:stretch;gap:10px;pointer-events:none}.dock>*{pointer-events:auto}
.sheet{padding:16px 18px;border-radius:24px;background:var(--panel);border:1px solid var(--tileedge);box-shadow:var(--float);display:flex;flex-direction:column;gap:10px}.sheet>div:first-child{display:flex;flex-direction:column;gap:2px}.sheet b{font-size:16px;line-height:1.25}.sheet small{display:block;font:12px var(--mono);color:var(--muted)}
.row{display:flex;gap:12px}
.btn{flex:1;min-height:var(--ctl);padding:0 8px;border-radius:16px;background:var(--panel);border:1px solid var(--edge);color:var(--ink);font-size:15px;font-weight:500;text-align:center}.pri{border-radius:999px;background:var(--accent);border-color:transparent;color:var(--onaccent);box-shadow:var(--glow)}.plain{flex:none;background:none;border-color:transparent;color:var(--accentfg);font-size:14px;font-weight:600}
.give{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.hint{align-self:center;min-height:48px;display:flex;align-items:center;padding:0 16px;border-radius:99px;background:var(--panel);box-shadow:var(--float);font-size:14px;color:var(--ink2)}
.wait{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.full{position:fixed;inset:0;z-index:2;background:var(--bg);overflow:auto;padding:76px 16px 24px;display:flex;flex-direction:column;gap:16px}
.cap{margin:0;padding:0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--tileedge);border-radius:24px;box-shadow:var(--float);padding:0 20px;display:flex;flex-direction:column}
.form{padding:18px 20px 20px;gap:10px}.form>b{margin-bottom:-6px;font-size:17px;font-weight:600;line-height:1.3}.form>.cap{padding:0}.thumb{display:flex;flex-direction:column;gap:6px;margin:0 0 4px}.thumb img{display:block;width:100%;height:96px;object-fit:cover;object-position:top;border-radius:16px;border:1px solid var(--line2);background:#fff}.ff{display:flex;flex-direction:column;gap:6px}.ff span{padding:0 8px;font-size:13px;color:var(--muted)}
.fld{min-height:48px;padding:0 16px;border-radius:16px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font-size:16px;width:100%}.fld.ro{font:14px var(--mono);color:var(--muted);border-color:transparent}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--ctl);font-size:15px}
.sw{width:52px;height:var(--tap);flex:none;display:flex;align-items:center;justify-content:center}.sw span{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);box-shadow:inset 0 0 0 1.5px var(--edge)}.sw span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--panel)}.sw[aria-checked="true"] span{background:var(--accent);box-shadow:none}.sw[aria-checked="true"] span::after{left:18px}
@media (hover:hover){.fb:hover,.tk:hover,.plain:hover{background:var(--hover)}}
.toast{position:fixed;left:20px;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;text-align:center}
.gone{position:fixed;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}.gone b{font-size:20px;font-weight:600;line-height:1.3}.gone p{margin:0;max-width:32ch;color:var(--muted)}
.side #upd{display:none!important}
.side .dock{visibility:hidden} /* laid out still, so the tab's room stays as it is */
</style>
</head>
<body>
<main id="stage" aria-label="The browser tab"><img id="shot" alt=""><button id="take" aria-label="Take the tab over"></button></main>
<header class="top" id="top">
  <button class="fb" id="back" aria-label="Close"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h1 class="where" id="where"><span class="bdot" aria-hidden="true"></span><span id="who">Agent</span><span class="u" id="addr"></span></h1>
  <button class="tk" id="tk" aria-label="Vault: saved logins, keys and sign-ins" hidden>Vault</button>
</header>
<div class="upd" id="upd" role="status" hidden><span class="live" aria-hidden="true"></span>Updating the page…</div>
<section class="full" id="needform" hidden></section>
<footer class="dock">
  <div class="sheet" id="offer" hidden><div><b id="offerwhat">Save this login?</b><small id="offerwho"></small></div><div class="row"><button class="btn" id="offerno">Not now</button><button class="btn pri" id="offeryes">Save</button></div></div>
  <span class="hint" id="hint">Tap the page to take it over</span>
  <div class="row" id="mine" hidden><button class="btn" id="navback">Back</button><button class="btn" id="reload">Reload</button><button class="btn give" id="give">Hand back</button></div>
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<div class="gone" id="gone" hidden><b>This tab closed</b><p>Ask the agent to open the page again.</p></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const field = (label, input) => el("label", { className: "ff" }, el("span", { textContent: label }), input);
  // AnywhereLLM Lite's channel, when this page shows inside it: told who has the tab and when it was
  // handed back; it draws the bar under the page that hands the tab back.
  const host = window.AnywhereLLMBrowser || null;
  if (host) document.body.classList.add("hosted");
  let st = null, size = { w: 430, h: 932 }, scale = 1, left = 0, top = 68, bottom = 0, over = null, shot = 0, swiped = false;
  let formFor = 0, dismissed = 0, skew = 0, lastText = "", shown = 0;
  // A step posted from here: "Updating" until a newer picture than `from` comes (or a few seconds,
  // for a step that changed nothing), showing `who` as this page set it until then.
  let pending = null, pendingTimer = 0;
  function settled() {
    clearTimeout(pendingTimer);
    pending = null;
    $("upd").hidden = true;
  }

  // ---- Posting: each step is an event, posted in order through AnythingLLM's upload.
  let queue = Promise.resolve();
  function post(ev, fields = {}) {
    const event = { browser_lean_event: 1, workspace: cfg.workspace, tab: cfg.tab, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    pending = { from: shot, who: pending?.who };
    $("upd").hidden = false;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(settled, 4000);
    queue = queue.then(async () => {
      try {
        const r = await fetch("/api/browser-extension/upload-content", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
          body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: cfg.title, docSource: "browser-lean page" } }),
        });
        if (!r.ok) toast(r.status === 403 ? "AnythingLLM refused the pages’ key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + r.status);
      } catch (e) {
        toast("Can’t reach AnythingLLM");
      }
      soon(); // the step's picture comes within a second: look for it now
    });
    return queue;
  }

  // RSA-OAEP seals at most 190 bytes; a longer value is sealed with a new AES-GCM key, itself
  // sealed with RSA: "h1.<sealed key>.<iv>.<sealed value>".
  const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  let pubKey = null;
  async function seal(text) {
    if (!window.crypto || !crypto.subtle) throw new Error("Open this page over https to send a password");
    pubKey ||= await crypto.subtle.importKey("spki", Uint8Array.from(atob(cfg.pub), (c) => c.charCodeAt(0)), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    const bytes = new TextEncoder().encode(text);
    if (bytes.length <= 190) return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, bytes));
    const aes = crypto.getRandomValues(new Uint8Array(32));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", aes, "AES-GCM", false, ["encrypt"]);
    const sealed = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
    return ["h1", b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, aes)), b64(iv), b64(sealed)].join(".");
  }

  let toastTimer = 0;
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ($("toast").hidden = true), 2600);
  }

  // ---- The picture, fitted between the controls, measured on each resize.
  function reserve() {
    top = Math.round($("top").getBoundingClientRect().bottom) + 8;
    const row = [$("hint"), $("mine")].find((b) => !b.hidden);
    bottom = !host && row ? Math.round(innerHeight - row.getBoundingClientRect().top) + 8 : 0;
    $("upd").style.top = top + "px";
    $("toast").style.bottom = bottom + 16 + "px";
  }
  function layout() {
    if (!st) return;
    const W = innerWidth, H = Math.max(1, innerHeight - top - bottom);
    scale = Math.min(W / size.w, H / size.h);
    left = (W - size.w * scale) / 2;
    Object.assign($("shot").style, { width: size.w * scale + "px", height: size.h * scale + "px", left: left + "px", top: top + "px" });
    if (over) place(over.input, over.field);
  }
  addEventListener("resize", () => (reserve(), layout(), askSize()));

  // ---- The tab's screen: this window's room between the controls, asked for once it settles; the
  // skill keeps it within the screens it draws.
  let sizeTimer = 0, asked = null;
  function askSize() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(() => {
      if (!st) return;
      const want = { w: innerWidth, h: innerHeight - top - bottom, dpr: devicePixelRatio || 1 };
      const have = asked || size;
      if (Math.abs(want.w - have.w) <= 8 && Math.abs(want.h - have.h) <= 8 && (!asked || want.dpr === asked.dpr)) return;
      asked = want;
      post("size", want);
    }, 500);
  }
  const toPage = (e) => ({ x: Math.round((e.clientX - left) / scale), y: Math.round((e.clientY - top) / scale) });
  const inside = (p, f) => p.x >= f.x && p.x <= f.x + f.w && p.y >= f.y && p.y <= f.y + f.h;

  // ---- Typing: a real input over the field the user tapped, so this device's keyboard opens.
  function place(input, f) {
    Object.assign(input.style, { left: left + f.x * scale + "px", top: top + f.y * scale + "px", width: Math.max(f.w * scale, 120) + "px", height: Math.max(f.h * scale, 40) + "px" });
  }
  const KINDS = { email: "email", password: "password", tel: "tel", url: "url", search: "search", date: "date", time: "time", month: "month", week: "week", "datetime-local": "datetime-local" };
  function nextField(f) {
    const after = (st.fields || []).filter((g) => g.ref !== f.ref && (g.y > f.y + 2 || (Math.abs(g.y - f.y) <= 2 && g.x > f.x)));
    return after.sort((a, b) => a.y - b.y || a.x - b.x)[0] || null;
  }
  function openField(f) {
    closeField(false);
    const input = el("input", { className: "over", type: KINDS[f.kind] || "text", autocomplete: f.kind === "password" ? "new-password" : "off", autocapitalize: "off", spellcheck: false, placeholder: f.filled ? "Type to replace" : "" });
    if (f.kind === "number") input.inputMode = "decimal";
    input.setAttribute("aria-label", f.kind === "password" ? "Password" : "Field on the page");
    input.enterKeyHint = nextField(f) ? "next" : "go";
    place(input, f);
    $("stage").appendChild(input);
    over = { input, field: f };
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const goNext = input.enterKeyHint === "next" && nextField(f);
      send(f, input.value, goNext ? "Tab" : "Enter");
      if (goNext) openField(goNext);
      else closeField(false);
    });
    input.addEventListener("blur", () => setTimeout(() => over && over.input === input && closeField(true), 0));
    input.focus();
  }
  function closeField(keep) {
    if (!over) return;
    const { input, field: f } = over;
    over = null;
    if (keep && input.value) send(f, input.value, null);
    input.remove();
  }
  async function send(f, value, then) {
    if (f.kind !== "password") return post("type", { ref: f.ref, text: value, then });
    try {
      return post("type", { ref: f.ref, sealed: await seal(value), then });
    } catch (e) {
      toast(e.message);
    }
  }

  // ---- Taps and swipes on the picture, each shown at once: a ripple where the finger lands, and
  // the picture following a swipe until the scrolled one comes.
  let down = null, slid = 0;
  const onPicture = (e) => e.target === $("stage") || e.target === $("shot") || e.target === $("take");
  const mine = () => st && st.who === "user";
  function ripple(e) {
    const dot = el("span", { className: "tap" });
    Object.assign(dot.style, { left: e.clientX + "px", top: e.clientY + "px" });
    dot.addEventListener("animationend", () => dot.remove());
    $("stage").appendChild(dot);
  }
  function slide(dy) {
    clearTimeout(slid);
    $("shot").style.transform = dy ? `translateY(${dy}px)` : "";
  }
  const isSwipe = (dx, dy) => Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx);
  $("stage").addEventListener("pointerdown", (e) => {
    if (!onPicture(e)) return;
    down = { x: e.clientX, y: e.clientY };
    ripple(e);
  });
  $("stage").addEventListener("pointermove", (e) => {
    if (!down || !mine()) return;
    const dy = e.clientY - down.y;
    if (isSwipe(e.clientX - down.x, dy)) slide(Math.max(-size.h * scale, Math.min(size.h * scale, dy)));
  });
  $("stage").addEventListener("pointerup", (e) => {
    const d = down;
    down = null;
    if (!d || !mine()) return;
    const dy = e.clientY - d.y;
    swiped = isSwipe(e.clientX - d.x, dy);
    if (!swiped) return slide(0);
    post("scroll", { dy: Math.round(-dy / scale) });
    slid = setTimeout(() => slide(0), 3000); // no picture came: put it back
  });
  // A tap on the picture: a field opens for typing, anything else is tapped in the tab.
  function tapAt(e) {
    const p = toPage(e);
    if (p.x < 0 || p.y < 0 || p.x > size.w || p.y > size.h) return;
    const f = (st.fields || []).find((g) => inside(p, g));
    if (f) return openField(f);
    closeField(true);
    post("tap", p);
  }
  $("stage").addEventListener("click", (e) => {
    if (swiped) return void (swiped = false);
    if (!mine() || e.target === $("take") || !onPicture(e)) return;
    tapAt(e);
  });
  // Takes the tab over, shown at once; the state file catches up. The first tap is a tap too.
  function takeOver() {
    st.who = "user";
    paint();
    post("take");
    pending.who = "user";
  }
  $("take").addEventListener("click", (e) => {
    if (!st) return;
    takeOver();
    tapAt(e);
  });
  function give() {
    if (!mine()) return Promise.resolve();
    closeField(true);
    st.who = "agent";
    paint();
    const done = post("give");
    pending.who = "agent";
    return done;
  }
  $("give").addEventListener("click", give);
  $("navback").addEventListener("click", () => (closeField(true), post("nav", { do: "back" })));
  $("reload").addEventListener("click", () => (closeField(true), post("nav", { do: "reload" })));
  // AnywhereLLM Lite's bar hands the tab back through this, before it sends a message to the agent.
  window.browserLean = { give: () => give().then(() => host && host.postMessage('{"gave":true}')) };
  let told = null;
  const tell = (who) => host && who !== told && host.postMessage(JSON.stringify({ who: (told = who) }));
  $("back").addEventListener("click", () => (history.length > 1 ? history.back() : window.close()));
  // The saved logins are listed and deleted on the Vault page (library-lean's), on this same host.
  $("tk").addEventListener("click", () => st && st.vault && (closeField(true), location.assign(st.vault)));

  // ---- What the agent asked for: a login or a code, entered here and typed into the page for it.
  // While it's asked, the page opens on its form; `formFor` is the request the form was made for
  // (its `until`), so a new one, or one asked again, gets a form of its own.
  const remaining = () => (st && st.need ? Math.round((st.need.until - (Date.now() + skew)) / 1000) : 0);
  const asking = () => !!(st && st.need) && st.need.until !== dismissed && remaining() > 0;
  let ticker = 0;
  function tick() {
    if (!asking()) return paint();
    const s = remaining(), m = Math.round(s / 60);
    $("needleft").textContent = "The agent is waiting · " + (s < 60 ? "Less than a minute" : m === 1 ? "About a minute" : "About " + m + " minutes") + " left";
  }
  /** Builds the form for the request now asked; returns its first field. */
  function needForm() {
    const need = st.need;
    formFor = need.until;
    const login = need.kind === "login";
    // The words for what's asked: a new account's password (the user chooses it), a login, a code.
    const says = login && need.confirm ? { title: "Choose a password for " + need.host, secret: "New password", go: "Create" }
      : login ? { title: "Sign in to " + need.host, secret: "Password", go: "Sign in" }
      : { title: need.label || "Enter the code", secret: need.label || "Code", go: "Send" };
    let keep = true;
    const user = login && need.hasUser ? el("input", { className: "fld", autocapitalize: "off", autocomplete: "off", spellcheck: false }) : null;
    const secret = el("input", { className: "fld", type: login ? "password" : "text", autocomplete: login ? "new-password" : "one-time-code", autocapitalize: "off" });
    const sw = el("button", { className: "sw", role: "switch" }, el("span"));
    sw.setAttribute("aria-checked", "true");
    sw.setAttribute("aria-label", "Save this login for next time");
    sw.onclick = () => sw.setAttribute("aria-checked", String((keep = !keep)));
    // Answered, turned down or taken over: this request is done here, and doesn't come back.
    const done = () => (dismissed = need.until);
    const no = el("button", { className: "btn", textContent: "Cancel", onclick: () => (done(), post("need-cancel", { reason: "later" }), paint()) });
    const take = el("button", { className: "btn plain", id: "needtake", textContent: "Take over instead", onclick: () => (done(), post("need-cancel", { reason: "takeover" }), takeOver()) });
    const go = el("button", { className: "btn pri", textContent: says.go });
    go.onclick = async () => {
      if (user && !user.value.trim()) return toast("Give the username");
      if (!secret.value.trim()) return toast(login ? "Give the password" : "Give the code");
      let fields;
      try {
        fields = login ? { user: user ? user.value.trim() : "", sealed: await seal(secret.value), save: keep && !!user } : { text: secret.value.trim() };
      } catch (e) {
        return toast(e.message);
      }
      done();
      post("need-answer", fields);
      paint();
    };
    // The tab, small: for a code, the site often says there where it sent it.
    const thumb = el("figure", { className: "thumb" }, el("img", { id: "needshot", alt: "" }), el("figcaption", { className: "cap", textContent: "The tab" }));
    const live = el("span", { className: "live" });
    live.setAttribute("aria-hidden", "true");
    $("needform").replaceChildren(el("div", { className: "card form" }, thumb, el("b", { textContent: says.title }), el("p", { className: "cap", textContent: need.text }),
      field("Site", el("input", { className: "fld ro", value: need.host, readOnly: true })),
      ...(user ? [field("Username or email", user)] : []),
      field(says.secret, secret),
      ...(user ? [el("div", { className: "tgl" }, el("span", { textContent: "Save this login for next time" }), sw)] : []),
      el("p", { className: "cap", textContent: login ? "Sealed on this device before it’s sent, and typed into the page for the agent, which never sees it." : "Typed into the page for the agent, which never sees it." }),
      el("div", { className: "wait" }, live, el("span", { id: "needleft" })),
      el("div", { className: "row" }, no, go), take));
    return user || secret;
  }
  $("offerno").addEventListener("click", () => (($("offer").hidden = true), post("offer", { save: false })));
  $("offeryes").addEventListener("click", () => (($("offer").hidden = true), post("offer", { save: true })));

  // ---- Drawing what the state file says.
  function paint() {
    if (!st) return;
    const held = mine();
    document.body.classList.toggle("mine", held);
    // The request's form, over the page view.
    if (formFor && !asking()) {
      if (formFor !== dismissed) toast("That request is over");
      formFor = 0;
    }
    const ask = asking();
    $("needform").hidden = !ask;
    if (ask) {
      const first = formFor !== st.need.until && needForm();
      $("needshot").src = $("shot").src;
      tick();
      if (first) first.focus();
    }
    if (ask !== !!ticker) ticker = ask ? setInterval(tick, 1000) : (clearInterval(ticker), 0);
    document.body.classList.toggle("side", ask);
    $("who").textContent = held ? "You" : "Agent";
    $("addr").textContent = (st.url || "").replace(/^https?:\/\//, "");
    $("where").setAttribute("aria-label", (held ? "You have the tab" : "The agent has the tab") + ": " + (st.title || st.url));
    $("take").hidden = held;
    $("mine").hidden = !held;
    $("hint").hidden = held;
    tell(st.who);
    $("offer").hidden = !st.offer || ask;
    if (st.offer) {
      const passkey = st.offer.kind === "passkey";
      $("offerwhat").textContent = passkey ? "Save this passkey?" : "Save this login?";
      $("offerwho").textContent = st.offer.site + (st.offer.user ? " · " + st.offer.user : passkey ? " · passkey" : "");
    }
    $("tk").hidden = !st.vault;
    reserve();
    layout();
  }

  // The state file, asked for often while a step is pending and less when idle.
  async function poll() {
    if (document.hidden && st) return; // out of sight: no polling, but the first state still draws
    let next, text;
    try {
      const r = await fetch(cfg.token + ".json", { cache: "no-cache" });
      const d = Date.parse(r.headers.get("Date") || "");
      if (d) skew = d - Date.now();
      text = await r.text();
      next = JSON.parse(text);
    } catch (e) {
      return; // not reached, or not the state file: the next poll tries again
    }
    if (next.closed) {
      $("gone").hidden = false;
      return tell("agent");
    }
    $("gone").hidden = true;
    const same = text === lastText;
    if (!same) {
      const first = !st;
      st = next;
      if (st.shot !== shot) {
        const fresh = shot !== 0; // a message already there when the page opened isn't news
        shot = st.shot;
        slide(0);
        if (st.size) size = st.size;
        $("shot").src = cfg.token + ".jpg?v=" + shot;
        if (pending && shot !== pending.from) settled();
        if (st.msg && st.msg.id !== shown) (fresh && toast(st.msg.text)), (shown = st.msg.id); // a line stays a while: shown once
      }
      if (first) askSize(); // the first state: ask for this window's room
    }
    const was = st.who;
    if (pending && pending.who) st.who = pending.who; // taken or handed back here; the state file catches up
    // What a field being typed into would lose is drawn once it closes; the request's form is kept
    // while its request is.
    if ((!same || st.who !== was) && !over) (lastText = text), paint();
  }
  let pollTimer = 0;
  function loop() {
    poll().finally(() => {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(loop, pending ? 250 : 2000);
    });
  }
  function soon() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(loop, 250);
  }
  reserve();
  loop();
  document.addEventListener("visibilitychange", poll);
})();
</script>
</body>
</html>
