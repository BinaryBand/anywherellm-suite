<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Library</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --card: #fff; --accent: #2f5bd3; --warn: #b5470b; --ok: #237a3c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #9b9a93; --line: #2f2e2b; --card: #1f1e1c; --accent: #8aa8ff; --warn: #f0995c; --ok: #7bcf8f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 0; z-index: 1; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; color: var(--muted); padding: 8px 10px; font: inherit; border-bottom: 2px solid transparent; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .cap { color: var(--muted); font-size: 13px; }
  .bad { color: var(--warn); } .good { color: var(--ok); }
  a { color: var(--accent); }
  button.act { margin-top: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.quiet { background: none; color: var(--warn); border-color: var(--line); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 360px; overflow: auto; }
  details > summary { cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Library</h1>
  <nav role="tablist">
    <button role="tab" data-tab="toolkits" aria-selected="true">Toolkits</button>
    <button role="tab" data-tab="runs">Runs</button>
  </nav>
</header>
<main>
  <p class="cap" id="vault" hidden>The keys and sign-ins the toolkits call with are in the <a id="vaultlink">Vault</a>.</p>
  <section id="toolkits"></section>
  <section id="runs" hidden></section>
  <p class="cap">Anyone with this page's link can see what it shows and act on it.
    <button class="act quiet" id="rotate">New link</button></p>
</main>
<div id="toast" hidden></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter((k) => k !== null && k !== undefined)); return n; };
  let toastTimer = 0;
  const toast = (text) => { $("toast").textContent = text; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").hidden = true), 4000); };

  // ---- Posting: each thing done here is an event, posted through AnythingLLM's upload.
  async function post(ev, fields = {}) {
    const event = { library_lean_event: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: cfg.title, docSource: "library-lean page" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages' key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + res.status), false;
      toast("Sent");
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can't reach AnythingLLM");
      return false;
    }
  }

  const remove = (text, ev, fields) => el("button", { className: "act quiet", type: "button", textContent: text, onclick: () => confirm(`${text}?`) && post(ev, fields) });

  function draw(s) {
    $("vault").hidden = !s.vault;
    if (s.vault) $("vaultlink").href = s.vault;
    const toolkits = $("toolkits"), runs = $("runs");
    toolkits.replaceChildren(...(s.toolkits.length ? [] : [el("p", { className: "cap", textContent: "No toolkits yet." })]));
    for (const t of s.toolkits) {
      toolkits.append(el("div", { className: "card" },
        el("div", { className: "row" }, el("strong", { textContent: t.title }), el("span", { className: "cap", textContent: t.service })),
        el("p", { className: "cap", textContent: `${t.base_urls.join(", ")}; keys: ${t.secrets.join(", ") || "none"}` }),
        ...t.functions.map((f) => el("details", {}, el("summary", { textContent: `${f.name}: ${f.description} (v${f.version})` }), el("pre", { textContent: f.source }), remove("Delete this function", "fn-delete", { fn: `${t.service}.${f.name}` }))),
        remove("Delete the toolkit", "toolkit-delete", { service: t.service })));
    }

    runs.replaceChildren(...(s.runs.length ? [] : [el("p", { className: "cap", textContent: "No runs yet." })]));
    for (const r of s.runs) {
      runs.append(el("details", { className: "card" },
        el("summary", {}, el("strong", { textContent: r.fn }), " ", el("span", { className: r.status === "ok" ? "good" : r.status === "running" ? "cap" : "bad", textContent: r.status }), " ",
          el("span", { className: "cap", textContent: `${new Date(r.ended).toLocaleString()}${r.status === "running" ? "" : `, ${(r.ms / 1000).toFixed(1)} s`}${r.trigger === "job" ? ", scheduled job" : ""}` })),
        el("pre", { textContent: r.error || r.result || "" })));
    }
  }

  let last = "";
  async function load() {
    try {
      const res = await fetch(cfg.token + ".json", { cache: "no-cache" });
      if (res.status === 404) return toast("This link was replaced: ask the agent for the Library page again");
      const text = await res.text();
      if (text !== last) (last = text), draw(JSON.parse(text));
    } catch (e) {
      toast("Can't reach AnythingLLM");
    }
  }

  for (const b of document.querySelectorAll("nav button")) {
    b.onclick = () => {
      for (const x of document.querySelectorAll("nav button")) x.setAttribute("aria-selected", String(x === b));
      for (const section of document.querySelectorAll("main section")) section.hidden = section.id !== b.dataset.tab;
    };
  }
  $("rotate").onclick = () => confirm("Make a new link? This one stops working.") && post("rotate");
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
