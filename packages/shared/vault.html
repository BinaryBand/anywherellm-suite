<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Vault</title>
<style>
/* The Vault, shared by the skills that keep secrets (packages/shared/vault-page.mts): a tab for each
   section a skill wrote, the keys and sign-ins (the library's) and the logins (the browser's). What's
   done in a section is posted under its title and applied by the skill that owns it. The look is
   AnywhereLLM Lite's, as the browser's tab page has it; ?theme=light or dark keeps it to one. */
:root{--bg:oklch(0.982 0.008 75);--panel:oklch(0.995 0.003 75);--line:oklch(0.895 0.014 75);--line2:oklch(0.928 0.012 75);--ink:oklch(0.27 0.025 280);--ink2:oklch(0.4 0.025 280);--muted:oklch(0.5 0.02 280);--accent:oklch(0.52 0.16 272);--accentbg:oklch(0.94 0.028 272);--onaccent:oklch(1 0 0);--hover:oklch(0.925 0.016 75);--badfg:oklch(0.47 0.16 20);--okfg:oklch(0.42 0.08 165);--okbg:oklch(0.945 0.04 165);--warnfg:oklch(0.45 0.1 70);--warnbg:oklch(0.95 0.045 80);
--float:0 12px 32px -8px oklch(0.3 0.04 280 / 0.28),0 2px 6px oklch(0.3 0.03 280 / 0.16);--sans:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(0.215 0.018 280);--panel:oklch(0.26 0.02 280);--line:oklch(0.36 0.022 280);--line2:oklch(0.31 0.02 280);--ink:oklch(0.93 0.01 75);--ink2:oklch(0.81 0.014 75);--muted:oklch(0.78 0.018 280);--accent:oklch(0.78 0.1 272);--accentbg:oklch(0.33 0.06 272);--onaccent:oklch(0.2 0.03 280);--hover:oklch(0.29 0.02 280);--badfg:oklch(0.83 0.085 20);--okfg:oklch(0.82 0.1 165);--okbg:oklch(0.32 0.05 165);--warnfg:oklch(0.84 0.1 80);--warnbg:oklch(0.33 0.05 70);--float:0 12px 32px -8px oklch(0 0 0 / 0.5),0 2px 6px oklch(0 0 0 / 0.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(0.215 0.018 280);--panel:oklch(0.26 0.02 280);--line:oklch(0.36 0.022 280);--line2:oklch(0.31 0.02 280);--ink:oklch(0.93 0.01 75);--ink2:oklch(0.81 0.014 75);--muted:oklch(0.78 0.018 280);--accent:oklch(0.78 0.1 272);--accentbg:oklch(0.33 0.06 272);--onaccent:oklch(0.2 0.03 280);--hover:oklch(0.29 0.02 280);--badfg:oklch(0.83 0.085 20);--okfg:oklch(0.82 0.1 165);--okbg:oklch(0.32 0.05 165);--warnfg:oklch(0.84 0.1 80);--warnbg:oklch(0.33 0.05 70);--float:0 12px 32px -8px oklch(0 0 0 / 0.5),0 2px 6px oklch(0 0 0 / 0.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.top h1{margin:0;font-size:19px;font-weight:600}
.rb{flex:none;width:48px;height:48px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;box-shadow:var(--float)}
main{max-width:640px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.lead,.cap{margin:0;padding:0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:16px;background:var(--hover)}
.seg button{flex:1;min-height:44px;border-radius:13px;font-size:14.5px;color:var(--ink2)}
.seg [aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600}
section{display:flex;flex-direction:column;gap:16px}
.lab{padding:0 20px;margin-bottom:-8px;font-size:12px;font-weight:500;letter-spacing:.48px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:24px;padding:0 20px;display:flex;flex-direction:column}
.card>*+*{border-top:1px solid var(--line2)}
.need{border-color:var(--accent)}
.row{min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.who small{font:12.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{flex:none;min-height:40px;padding:0 14px;border-radius:99px;color:var(--badfg);font-size:15px}
.tag{flex:none;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--warnbg);color:var(--warnfg)}
.tag.ok{background:var(--okbg);color:var(--okfg)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .chev{flex:none;color:var(--muted);transition:transform .2s}
details[open] summary .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){summary .chev{transition:none}}
.body{display:flex;flex-direction:column;gap:12px;padding:4px 0 20px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:13px var(--mono);color:var(--ink2);overflow-wrap:anywhere;align-self:center}
.say{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.need form,.card>form{padding:20px 0}
.ff{display:flex;flex-direction:column;gap:6px}
.ff>span{padding:0 8px;font-size:13px;color:var(--muted)}
.fld{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.btn{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:500;text-align:center}
.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.bad{color:var(--badfg)}
.pair{display:flex;gap:8px}.pair .btn{flex:1}
.add{min-height:60px;display:flex;align-items:center;gap:12px;color:var(--accent);font-size:16px;font-weight:600;width:100%}
.ask{display:flex;flex-direction:column;gap:12px;padding:4px 0 16px}
.ask p{margin:0;font-size:15px;line-height:1.5}
.empty{margin:0;padding:20px 0;font-size:15px;color:var(--muted)}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:8px}
.foot .btn{border-color:transparent;background:none;color:var(--badfg);padding:0 8px}
#toast{position:fixed;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;max-width:600px;margin:0 auto;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <button class="rb" id="close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h1>Vault</h1>
</header>
<main>
  <p class="lead">What the agent signs in and calls with. Encrypted on your AnythingLLM server and shared by every workspace. The agent uses each one on its own site only, and never reads it.</p>
  <nav class="seg" role="tablist" aria-label="Show">
    <button role="tab" data-tab="keys" data-section="keys" hidden>Keys</button>
    <button role="tab" data-tab="signins" data-section="keys" hidden>Sign-ins</button>
    <button role="tab" data-tab="logins" data-section="logins" hidden>Logins</button>
  </nav>
  <section id="keys" hidden></section>
  <section id="signins" hidden></section>
  <section id="logins" hidden></section>
  <div class="foot" id="foot"><p class="cap">Anyone with this page's link can see what it shows and act on it.</p></div>
</main>
<div id="toast" role="status" hidden></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const node = Object.assign(document.createElement(tag), props); node.append(...kids.filter((kid) => kid !== null && kid !== undefined && kid !== false)); return node; };
  const icon = (d, size = 18) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.6"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true"); s.innerHTML = `<path d="${d}"/>`; return s; };
  let toastTimer = 0;
  const toast = (text) => { $("toast").textContent = text; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").hidden = true), 4000); };
  $("close").onclick = () => (history.length > 1 ? history.back() : window.close());

  // ---- Posting: each thing done here is an event of its section, posted through AnythingLLM's
  // upload under the section's title, so the skill that owns the section applies it.
  async function post(section, ev, fields = {}) {
    const event = { vault_lean_event: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: "vault-lean-" + section, docSource: "vault-lean page" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages' key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + res.status), false;
      toast("Sent");
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can't reach AnythingLLM");
      return false;
    }
  }

  // RSA-OAEP seals at most 190 bytes; a longer value (a token, say) is sealed with a new AES-GCM
  // key, itself sealed with RSA: "h1.<sealed key>.<iv>.<sealed value>".
  const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  let pubKey = null;
  async function seal(text) {
    if (!crypto.subtle) throw new Error("Open this page over https to give a key: over plain http, the browser can't seal it");
    const bytes = new TextEncoder().encode(text);
    pubKey ||= await crypto.subtle.importKey("spki", Uint8Array.from(atob(cfg.pub), (c) => c.charCodeAt(0)), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    if (bytes.length <= 190) return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, bytes));
    const aes = crypto.getRandomValues(new Uint8Array(32));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", aes, "AES-GCM", false, ["encrypt"]);
    const sealed = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
    return ["h1", b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, aes)), b64(iv), b64(sealed)].join(".");
  }

  // A labelled field. Not a login form: a password field asks for a new value (so the browser fills
  // in no saved password, nor a user name beside it), and names hold nothing a browser reads as one.
  const field = (inputs, name, label, type = "text", mono = false) =>
    el("label", { className: "ff" }, el("span", { textContent: label }),
      (inputs[name] = el("input", { className: "fld", type, name: `vault-${name}-${Math.random().toString(36).slice(2, 8)}`, autocomplete: type === "password" ? "new-password" : "off", autocapitalize: "off", spellcheck: false, style: mono ? "font:14px var(--mono)" : "" })));

  /** A form of `fields` ([name, label, type?, mono?]) that sends with `submit`; `onsubmit` answers
   *  whether it went, which clears it. `extra` goes between the fields and the button. */
  function form(fields, submit, onsubmit, extra = []) {
    const inputs = {};
    const node = el("form", {}, ...fields.map(([name, label, type, mono]) => field(inputs, name, label, type, mono)), ...extra, el("button", { className: "btn pri", type: "submit", textContent: submit }));
    node.onsubmit = async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));
      try {
        if (await onsubmit(v)) node.reset();
      } catch (err) {
        toast(err.message);
      }
    };
    return node;
  }

  const sealedNote = () => el("p", { className: "cap", style: "padding:0", textContent: "Sealed on this device before it is sent; the agent never sees it." });

  /** A button that asks first, in place (`asked`, then Keep or `yes`), before it runs `run`; its
   *  `del` goes where it shows, its `box` where the question opens. Heard as `label`. */
  function remove(asked, label, run, { text = "Delete", className = "del", yes = "Delete" } = {}) {
    const box = el("div", {});
    const del = el("button", { className, type: "button", textContent: text });
    del.setAttribute("aria-label", label);
    del.onclick = (e) => {
      e.preventDefault();
      const keep = el("button", { className: "btn", type: "button", textContent: "Keep", onclick: () => box.replaceChildren() });
      const go = el("button", { className: "btn bad", type: "button", textContent: yes, onclick: () => (box.replaceChildren(), run()) });
      box.replaceChildren(el("div", { className: "ask", role: "group" }, el("p", { textContent: asked }), el("div", { className: "pair" }, keep, go)));
      keep.focus();
    };
    return { del, box };
  }

  /** A row of a card: its name over its detail (mono), then `end`, a Delete or a tag. */
  const row = (name, detail, ...end) => el("div", { className: "row" }, el("div", { className: "who" }, el("b", { textContent: name }), el("small", { textContent: detail })), ...end);

  // ---- Keys and sign-ins: the library's section.
  let adding = false;
  /** A tab's label, with how many it holds. */
  const count = (tab, label, n) => (document.querySelector(`nav [data-tab="${tab}"]`).textContent = `${label} · ${n}`);

  function drawKeys(ks) {
    const keys = $("keys"), signins = $("signins");
    count("keys", "Keys", ks.secrets.filter((x) => x.kind === "key").length);
    count("signins", "Sign-ins", ks.secrets.filter((x) => x.kind === "oauth").length);
    const needs = ks.needs.map((n) => {
      const f = form([["value", "Key", "password"]], "Save key", async (v) => {
        if (!v.value) return toast("Paste the key first"), false;
        return post("keys", "key-save", { label: n.label, site: n.site, sealed: await seal(v.value) });
      }, [sealedNote()]);
      f.prepend(el("div", { style: "display:flex;flex-direction:column;gap:4px" }, el("b", { style: "font-size:17px;font-weight:600", textContent: "The agent asked for a key" }), el("span", { className: "say", textContent: `It goes only to ${n.site}, and the agent never sees it.` })),
        el("dl", { className: "kv" }, el("dt", { textContent: "Name" }), el("dd", { textContent: n.label }), el("dt", { textContent: "Site" }), el("dd", { textContent: n.site })));
      return el("div", { className: "card need" }, f);
    });
    const saved = ks.secrets.filter((x) => x.kind === "key").map((k) => {
      const { del, box } = remove(`Delete the key ${k.label}? The agent can't call ${k.site} with it after.`, `Delete the key ${k.label}`, () => post("keys", "key-delete", { label: k.label }));
      return el("div", {}, row(k.label, k.site, del), box);
    });
    const addForm = form([["label", "Name, like github"], ["site", "The site it goes to, like api.github.com", "text", true], ["value", "Key", "password"]], "Save key", async (v) => {
      if (!v.value || !v.label || !v.site) return toast("Fill in every field"), false;
      if (ks.secrets.some((x) => x.kind === "oauth" && x.label.toLowerCase() === v.label.trim().toLowerCase())) return toast("That name is a sign-in's: use another"), false;
      const went = await post("keys", "key-save", { label: v.label, site: v.site, sealed: await seal(v.value) });
      if (went) (adding = false), drawKeys(ks);
      return went;
    }, [sealedNote()]);
    const add = el("button", { className: "add", type: "button", onclick: () => ((adding = !adding), drawKeys(ks)) }, icon(adding ? "M4 8h8" : "M8 3v10M3 8h10"), adding ? "Cancel" : "Add a key");
    keys.replaceChildren(...needs, el("div", { className: "lab", textContent: "API keys" }), el("div", { className: "card" }, ...saved, ...(saved.length ? [] : [el("p", { className: "empty", textContent: "No keys yet. The agent asks for one when a task needs it." })]), el("div", {}, add, adding ? addForm : null)),
      el("p", { className: "cap", textContent: "A key goes only to its own site, over https, at most 60 times a minute. Saving under the name of a key replaces that key; a sign-in's name can't be used for a key." }));

    const oauth = ks.secrets.filter((x) => x.kind === "oauth");
    const items = oauth.map((o) => {
      const tag = el("span", { className: "tag" + (o.tag.ok ? " ok" : ""), textContent: o.tag.text });
      const { del, box } = remove(`Delete the sign-in ${o.label}? The agent can't reach ${o.site} with it after. Remove its access in the provider's own settings too.`, `Delete the sign-in ${o.label}`, () => post("keys", "key-delete", { label: o.label }), { text: "Delete sign-in", className: "btn bad" });
      return el("details", {},
        el("summary", {}, el("div", { className: "row" }, el("div", { className: "who" }, el("b", { textContent: o.label }), el("small", { textContent: `${o.site}${o.scopes ? " · " + o.scopes : ""}` })), tag, el("span", { className: "chev" }, icon("M4 6l4 4 4-4", 14)))),
        el("div", { className: "body" }, el("dl", { className: "kv" }, el("dt", { textContent: "Status" }), el("dd", { textContent: o.status }), ...(o.scopes ? [el("dt", { textContent: "Scopes" }), el("dd", { textContent: o.scopes })] : [])), del, box));
    });
    signins.replaceChildren(el("div", { className: "lab", textContent: "Sign-ins" }),
      el("div", { className: "card" }, ...items, ...(items.length ? [] : [el("p", { className: "empty", textContent: "No sign-ins yet. The agent starts one when a task needs it." })])),
      el("p", { className: "cap", textContent: "One sign-in for each provider. Its tokens go only to the site named, and are renewed by themselves as they run out." }));
  }

  // ---- Logins and passkeys: the browser's section, saved as the user signs in on a tab's page.
  function drawLogins(ls) {
    count("logins", "Logins", ls.logins.length);
    const rows = ls.logins.map((l) => {
      const passkey = l.kind === "passkey";
      const asked = passkey ? `Delete the passkey for ${l.site}? The agent can't sign in with it after. Remove it in the site's own settings too.` : `Delete the login for ${l.site}? The agent can't sign in there with it after.`;
      const { del, box } = remove(asked, `Delete the ${passkey ? "passkey" : "login"} for ${l.site}`, () => post("logins", "login-delete", { id: l.id }));
      return el("div", {}, row(l.site, [l.user, passkey ? "Passkey" : "Password"].filter(Boolean).join(" · "), del), box);
    });
    $("logins").replaceChildren(el("div", { className: "lab", textContent: "Logins" }),
      el("div", { className: "card" }, ...rows, ...(rows.length ? [] : [el("p", { className: "empty", textContent: "No logins yet. The browser offers to save one when you sign in on its tab's page." })])),
      el("p", { className: "cap", textContent: "Saved as you sign in on the agent's browser, and typed in there on their own site only. To change a password, sign in on the tab again and save it." }));
  }

  // ---- The sections there are, each its own state file; a tab for each. A section the user is in
  // the middle of (a form being filled) isn't drawn again under them.
  const drawn = { keys: drawKeys, logins: drawLogins };
  const shown = new Set();
  const last = {};
  const busy = (section) => [...document.querySelectorAll(`section[data-section="${section}"]`)].some((s) => s.querySelector(".ask") || [...s.querySelectorAll("input")].some((i) => i.value || i === document.activeElement));
  const select = (b) => {
    for (const x of document.querySelectorAll("nav button")) x.setAttribute("aria-selected", String(x === b));
    for (const section of document.querySelectorAll("main section")) section.hidden = section.id !== b.dataset.tab;
  };
  for (const s of ["keys", "signins"]) $(s).dataset.section = "keys";
  $("logins").dataset.section = "logins";
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => select(b);
  async function load() {
    try {
      const found = await Promise.all(Object.keys(drawn).map(async (section) => {
        const res = await fetch(`${cfg.token}-${section}.json`, { cache: "no-cache" });
        if (!res.ok) return false;
        const text = await res.text();
        if (text !== last[section] && !busy(section)) (last[section] = text), drawn[section](JSON.parse(text));
        shown.add(section);
        return true;
      }));
      if (!found.some(Boolean)) return toast("This link was replaced: ask the agent for the Vault's link again");
      const tabs = [...document.querySelectorAll("nav button")];
      for (const b of tabs) b.hidden = !shown.has(b.dataset.section);
      document.querySelector("nav").hidden = tabs.filter((b) => !b.hidden).length < 2; // one tab says nothing
      $("rotatebox").hidden = !shown.size;
      if (!tabs.some((b) => !b.hidden && b.getAttribute("aria-selected") === "true")) select(tabs.find((b) => !b.hidden));
    } catch (e) {
      toast("Can't reach AnythingLLM");
    }
  }

  // ---- A new link, asked in place.
  const rotate = remove("Make a new link? This one stops working, everywhere it was shared.", "Make a new link", () => post([...shown][0], "rotate"), { text: "New link", className: "btn", yes: "Make it" });
  $("foot").append(el("div", { id: "rotatebox", hidden: true }, rotate.del, rotate.box));
  load();
  setInterval(load, 5000);
})();
</script>
