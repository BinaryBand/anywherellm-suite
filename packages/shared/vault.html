<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Vault</title>
<style>
/* The Vault, shared by the skills that keep secrets (packages/shared/vault-page.mts): a tab for each
   section a skill wrote, Keys (the library's API keys and signing keys, a group each), Logins
   (the browser's) and Addresses (either skill's: addresses.mts). What's done in a section is posted under its
   title and applied by the skill that owns it. The look is
   AnywhereLLM Lite's, as the browser's tab page has it; ?theme=light or dark keeps it to one. */
/* house tokens: AnywhereLLM Lite's colours (the design canvas's lite.css), the same in every page. Dark
   follows the device unless <html data-theme> is light or dark; high contrast follows prefers-contrast,
   and <html data-contrast> more or off forces it. */
:root{color-scheme:light dark;
--bg:light-dark(oklch(0.962 0.012 272),oklch(0.19 0.014 272));
--panel:light-dark(oklch(0.995 0.002 272),oklch(0.27 0.018 272));
--well:light-dark(oklch(0.94 0.016 272),oklch(0.31 0.02 272));
--page:light-dark(oklch(0.99 0 0),oklch(0.18 0.01 280));
--line:light-dark(oklch(0.89 0.014 272),oklch(0.4 0.022 272));
--line2:light-dark(oklch(0.925 0.012 272),oklch(0.33 0.02 272));
--ink:light-dark(oklch(0.25 0.03 272),oklch(0.94 0.01 272));
--ink2:light-dark(oklch(0.38 0.028 272),oklch(0.82 0.014 272));
--muted:light-dark(oklch(0.46 0.025 272),oklch(0.72 0.02 272));
--accent:light-dark(oklch(0.54 0.22 272),oklch(0.62 0.18 272));
--accentbg:light-dark(oklch(0.908 0.044 270),oklch(0.34 0.09 272));
--accentfg:light-dark(oklch(0.45 0.209 272),oklch(0.834 0.082 269));
--onaccent:light-dark(oklch(1 0 0),oklch(0.2 0.05 272));
--hover:light-dark(oklch(0.925 0.016 272),oklch(0.31 0.02 272));
--sel:light-dark(oklch(0.917 0.04 270),oklch(0.331 0.063 272));
--okfg:light-dark(oklch(0.468 0.083 184),oklch(0.801 0.12 185));
--okbg:light-dark(oklch(0.945 0.04 185),oklch(0.32 0.05 185));
--okdot:light-dark(oklch(0.628 0.111 184),oklch(0.726 0.128 184));
--warnfg:light-dark(oklch(0.529 0.119 64),oklch(0.83 0.12 65));
--warnbg:light-dark(oklch(0.944 0.039 66),oklch(0.319 0.05 65));
--badfg:light-dark(oklch(0.42 0.17 27),oklch(0.7 0.119 27));
--edge:light-dark(oklch(0.58 0.02 272),oklch(0.6 0.022 272));
--off:light-dark(oklch(0.84 0.012 272),oklch(0.42 0.02 272));
--bubble:light-dark(oklch(0.917 0.04 270),oklch(0.319 0.064 271));
--scrim:light-dark(oklch(0.25 0.03 272 / 0.4),oklch(0.1 0.02 272 / 0.6));
--shadow:light-dark(oklch(0.35 0.06 272 / 0.14),oklch(0.05 0.02 272 / 0.4));
--tileedge:transparent;
--hi:light-dark(transparent,oklch(1 0 0 / 0.06));
--sh0:light-dark(oklch(0.35 0.06 272 / 0.1),transparent);
--sh1:light-dark(oklch(0.35 0.06 272 / 0.08),transparent);
--sh2:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.4));
--sh3:light-dark(oklch(0.35 0.06 272 / 0.08),oklch(0.05 0.02 272 / 0.3));
--tileshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh1),0 4px 8px var(--sh2),0 12px 24px var(--sh3);
--chipshadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh0),0 4px 8px var(--sh2);
--fl1:light-dark(oklch(0.35 0.06 272 / 0.28),oklch(0 0 0 / 0.5));
--fl2:light-dark(oklch(0.35 0.06 272 / 0.16),oklch(0 0 0 / 0.3));
--float:0 12px 32px -8px var(--fl1),0 2px 6px var(--fl2);
--glow:0 8px 24px -4px color-mix(in oklab,var(--accent) 35%,transparent);
--sheetbg:var(--panel);
--sheetblur:none;
--sheetedge:transparent;
--sheethi:light-dark(oklch(1 0 0 / 0.7),oklch(1 0 0 / 0.1));
--meshA:light-dark(oklch(0.91 0.055 350),oklch(0.30 0.08 340));
--meshB:light-dark(oklch(0.89 0.07 295),oklch(0.32 0.10 295));
--meshC:light-dark(oklch(0.91 0.045 255),oklch(0.30 0.07 255))}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-contrast: more){:root:not([data-contrast="off"]){
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}}
:root[data-contrast="more"]{
--ink:light-dark(oklch(0.2 0.03 272),oklch(0.98 0.005 272));
--ink2:light-dark(oklch(0.3 0.03 272),oklch(0.9 0.01 272));
--muted:light-dark(oklch(0.38 0.03 272),oklch(0.82 0.015 272));
--accent:light-dark(oklch(0.45 0.19 272),oklch(0.8 0.12 272));
--accentfg:light-dark(oklch(0.4 0.19 272),oklch(0.9 0.08 272));
--line:light-dark(oklch(0.55 0.02 272),oklch(0.65 0.02 272));
--line2:light-dark(oklch(0.65 0.02 272),oklch(0.55 0.02 272));
--edge:light-dark(oklch(0.5 0.03 272),oklch(0.75 0.02 272));
--tileedge:var(--edge);--sheetedge:var(--edge);
--hi:transparent;--sh0:transparent;--sh1:transparent;--sh2:transparent;--sh3:transparent;--shadow:transparent;
--float:0 0 0 1px var(--edge);--glow:none;
--sheetbg:var(--panel);--sheetblur:none;--sheethi:transparent;
--meshA:transparent;--meshB:transparent;--meshC:transparent}
/* end of house tokens */
:root{--sans:'Instrument Sans','Noto Sans','Segoe UI',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
/* density: the canvas's desktop boards size by the input, not the width. Touch sizes (44px controls,
   48px icon buttons, 56px rows) everywhere but where the only pointer is a mouse or trackpad. */
:root{--ctl:44px;--tap:48px;--row:56px}
@media (pointer:fine) and (hover:hover) and (not (any-pointer:coarse)){:root{--ctl:36px;--tap:36px;--row:40px}}
/* end of density */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input:focus-visible{outline-offset:-3px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));background:var(--bg)}
.top h1{flex:1;min-width:0;margin:0;font-size:19px;font-weight:600}
.rb{flex:none;width:var(--tap);height:var(--tap);border-radius:50%;background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--edge),var(--float)}
main{max-width:640px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.lead,.cap{margin:0;padding:0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.seg{display:flex;padding:3px;border-radius:16px;background:var(--hover)}
.seg button{flex:1;min-height:var(--ctl);padding:0 4px;border-radius:13px;font-size:14px;line-height:1.2;text-align:center;white-space:nowrap;color:var(--ink)}
.seg [aria-selected="true"]{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--edge);color:var(--ink);font-weight:600}
section{display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:16px}
.grp:empty{display:none}
.lab{padding:0 20px;margin-bottom:-8px;font-size:12px;font-weight:500;letter-spacing:.48px;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--tileedge);border-radius:24px;padding:0 20px;display:flex;flex-direction:column;box-shadow:var(--tileshadow)}
.card>*+*{border-top:1px solid var(--line2)}
.need{border-color:var(--accent);box-shadow:none}
.row{min-height:var(--row);display:flex;align-items:center;gap:12px;padding:10px 0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.who small{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .who b{font:500 14px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .who small{font-family:var(--sans)}
.del{flex:none;min-height:var(--ctl);padding:0 14px;border-radius:99px;color:var(--badfg);font-size:15px}
.tag{flex:none;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--warnbg);color:var(--warnfg)}
.tag.ok{background:var(--okbg);color:var(--okfg)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .chev{flex:none;color:var(--muted);transition:transform .2s}
details[open] summary .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){summary .chev{transition:none}}
.body{display:flex;flex-direction:column;gap:12px;padding:4px 0 20px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:13px var(--mono);color:var(--ink2);overflow-wrap:anywhere;align-self:center}
.kv dd.line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.need form,.card>form{padding:20px 0}
.ff{display:flex;flex-direction:column;gap:6px}
.ff>span,.ff>label{padding:0 8px;font-size:13px;color:var(--muted)}
.fld{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font-size:16px}
.fld.mono{font-family:var(--mono)}
input::placeholder{color:var(--muted);opacity:1}
.peek{position:relative}
.peek .fld{padding-right:76px}
.peek button{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-width:var(--ctl);min-height:var(--ctl);padding:0 12px;border-radius:12px;color:var(--accentfg);font-size:14px;font-weight:600}
.btn{min-height:var(--ctl);padding:0 12px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-size:15px;font-weight:500;text-align:center}
.pri{border:0;border-radius:999px;background:var(--accent);color:var(--onaccent);box-shadow:var(--glow)}
.row .btn{flex:none;padding:0 16px}
.bad{color:var(--badfg)}
.pair{display:flex;gap:12px}.pair .btn{flex:1;padding:4px 12px}
.add{min-height:var(--row);display:flex;align-items:center;gap:12px;color:var(--accentfg);font-size:16px;font-weight:600;width:100%}
.add+form{padding-bottom:20px}
.empty{margin:0;padding:20px 0;font-size:15px;color:var(--muted)}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:8px}
.foot .btn{border:0;background:none;color:var(--badfg);padding:0 8px;font-weight:500}
.scrim{position:fixed;inset:0;z-index:3;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;max-width:640px;margin:0 auto;gap:0;background:var(--panel);border:1px solid var(--sheetedge);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -12px 32px -12px var(--shadow);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.grip{align-self:center;flex:none;width:40px;height:4px;margin-top:10px;border-radius:99px;background:var(--line)}
.q{display:flex;flex-direction:column;gap:20px;padding:14px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.q h2{margin:0 0 6px;font-size:19px;font-weight:600}
.q p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.two{display:flex;gap:12px}
.two button{flex:1;min-height:52px;padding:0 12px;border-radius:16px;background:var(--panel);font-size:16px;font-weight:500}
.two .keep{border:2px solid var(--accent);color:var(--ink)}
.two .go{border:1px solid var(--edge);color:var(--badfg)}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
@media (hover:hover){.rb:hover,.del:hover,.foot .btn:hover,.peek button:hover{background:var(--hover)}}
#toast{position:fixed;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;max-width:600px;margin:0 auto;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--float);font-size:14px;text-align:center}
</style>
</head>
<body>
<header class="top">
  <button class="rb" id="close" aria-label="Close the Vault"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h1>Vault</h1>
</header>
<main>
  <p class="lead">Encrypted on your server. The agent never sees these.</p>
  <nav class="seg" role="tablist" aria-label="Show">
    <button role="tab" data-tab="keys" hidden>Keys</button>
    <button role="tab" data-tab="logins" hidden>Logins</button>
    <button role="tab" data-tab="addresses" hidden>Addresses</button>
  </nav>
  <section id="keys" hidden><div class="grp" id="apikeys"></div><div class="grp" id="signing"></div></section>
  <section id="logins" hidden></section>
  <section id="addresses" hidden></section>
  <div class="foot" id="foot"><p class="cap">Anyone with this page’s link can see what it shows and act on it.</p></div>
</main>
<div id="toast" role="status" hidden></div>
<script>
(() => {
  const cfg = /*CONFIG*/null;
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const node = Object.assign(document.createElement(tag), props); node.append(...kids.filter((kid) => kid !== null && kid !== undefined && kid !== false)); return node; };
  const icon = (d, size = 18) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.6"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true"); s.innerHTML = `<path d="${d}"/>`; return s; };
  let toastTimer = 0;
  const toast = (text) => { $("toast").textContent = text; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").hidden = true), 4000); };
  $("close").onclick = () => (history.length > 1 ? history.back() : window.close());

  // ---- Posting: each thing done here is an event of its section, posted through AnythingLLM's
  // upload under the section's title, so the skill that owns the section applies it.
  async function post(section, ev, fields = {}) {
    const event = { vault_lean_event: 1, secret: cfg.secret, ev, ...fields, t: new Date().toISOString() };
    try {
      const res = await fetch("/api/browser-extension/upload-content", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
        body: JSON.stringify({ textContent: JSON.stringify(event), metadata: { title: "vault-lean-" + section, docSource: "vault-lean page" } }),
      });
      if (!res.ok) return toast(res.status === 403 ? "AnythingLLM refused the pages’ key: make a new one in its Settings > Browser Extension, then run anywherellm-suite install --page-key with it" : "AnythingLLM answered " + res.status), false;
      toast("Sent");
      setTimeout(load, 1500);
      return true;
    } catch (e) {
      toast("Can’t reach AnythingLLM");
      return false;
    }
  }

  // RSA-OAEP seals at most 190 bytes; a longer value (a token, say) is sealed with a new AES-GCM
  // key, itself sealed with RSA: "h1.<sealed key>.<iv>.<sealed value>".
  const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  let pubKey = null;
  async function seal(text) {
    if (!crypto.subtle) throw new Error("Open this page over https to give a key: over plain http, the browser can’t seal it");
    const bytes = new TextEncoder().encode(text);
    pubKey ||= await crypto.subtle.importKey("spki", Uint8Array.from(atob(cfg.pub), (c) => c.charCodeAt(0)), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    if (bytes.length <= 190) return b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, bytes));
    const aes = crypto.getRandomValues(new Uint8Array(32));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey("raw", aes, "AES-GCM", false, ["encrypt"]);
    const sealed = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
    return ["h1", b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, aes)), b64(iv), b64(sealed)].join(".");
  }

  // A labelled field. Not a login form: a password field asks for a new value (so the browser fills
  // in no saved password, nor a user name beside it), and names hold nothing a browser reads as one.
  // A password field has Show at its end, which shows what was typed until Hide; it is heard with
  // the first word of the label ("Show key").
  const field = (inputs, name, label, type = "text", mono = false, placeholder = "") => {
    const input = (inputs[name] = el("input", { type, name: `vault-${name}-${Math.random().toString(36).slice(2, 8)}`, autocomplete: type === "password" ? "new-password" : "off", autocapitalize: "off", spellcheck: false, placeholder, className: mono ? "fld mono" : "fld" }));
    if (type !== "password") return el("label", { className: "ff" }, el("span", { textContent: label }), input);
    input.id = input.name;
    const what = label.split(/[\s,]/)[0].toLowerCase();
    const show = el("button", { type: "button" });
    const reveal = (on) => {
      input.type = on ? "text" : "password";
      show.textContent = on ? "Hide" : "Show";
      show.setAttribute("aria-pressed", String(on));
      show.setAttribute("aria-label", `${show.textContent} ${what}`);
    };
    show.onclick = () => reveal(input.type === "password");
    reveal(false);
    return el("div", { className: "ff" }, el("label", { htmlFor: input.id, textContent: label }), el("div", { className: "peek" }, input, show));
  };

  /** A form of `fields` ([name, label, type?, mono?, placeholder?]) that sends with `submit`;
   *  `onsubmit` answers whether it went, which clears it and hides any field shown. `extra` goes
   *  between the fields and the button. */
  function form(fields, submit, onsubmit, extra = []) {
    const inputs = {};
    const node = el("form", {}, ...fields.map(([name, label, type, mono, placeholder]) => field(inputs, name, label, type, mono, placeholder)), ...extra, el("button", { className: "btn pri", type: "submit", textContent: submit }));
    node.addEventListener("reset", () => { for (const b of node.querySelectorAll('.peek [aria-pressed="true"]')) b.click(); });
    node.onsubmit = async (e) => {
      e.preventDefault();
      const v = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));
      try {
        if (await onsubmit(v)) node.reset();
      } catch (err) {
        toast(err.message);
      }
    };
    return node;
  }

  const sealedNote = () => el("p", { className: "cap", style: "padding:0", textContent: "Sealed on this device." });

  /** The question open in the sheet ({ close }), if any: busy() reads it, so no reload draws under it. */
  let asking = null;

  /** Asks `title` in a sheet over the page, `line` under it, then Keep and `yes`: `yes` closes it and
   *  runs `run`, unless `from`, the button it was asked from, has since been drawn away. Keep, Esc and
   *  the scrim close it; focus goes back to `from`. One at a time. */
  function ask(title, line, yes, run, from) {
    asking?.close();
    const shade = [document.querySelector("header"), document.querySelector("main")];
    const was = shade.map((part) => part.inert);
    const id = "q" + Math.random().toString(36).slice(2, 8);
    const keep = el("button", { className: "keep", type: "button", textContent: "Keep" });
    const go = el("button", { className: "go", type: "button", textContent: yes });
    const scrim = el("div", { className: "scrim" });
    const sheet = el("section", { className: "sheet" }, el("span", { className: "grip" }),
      el("div", { className: "q" }, el("div", {}, el("h2", { id: id + "t", textContent: title }), el("p", { id: id + "l", textContent: line })), el("div", { className: "two" }, keep, go)));
    for (const [k, v] of [["role", "dialog"], ["aria-modal", "true"], ["aria-labelledby", id + "t"], ["aria-describedby", id + "l"]]) sheet.setAttribute(k, v);
    const me = {
      close: () => {
        if (asking !== me) return;
        asking = null;
        scrim.remove(), sheet.remove();
        shade.forEach((part, i) => (part.inert = was[i]));
        if (from.isConnected) from.focus();
      },
    };
    keep.onclick = scrim.onclick = me.close;
    go.onclick = () => {
      const live = from.isConnected;
      me.close();
      if (live) run();
    };
    for (const part of shade) part.inert = true;
    document.body.append(scrim, sheet);
    asking = me;
    keep.focus();
  }

  /** A button that asks first, in the sheet (`asked`: the question and the line under it, then Keep
   *  or `yes`), before it runs `run`; its `del` goes where it shows. Heard as `label`. */
  function remove(asked, label, run, { text = "Delete", className = "del", yes = "Delete" } = {}) {
    const del = el("button", { className, type: "button", textContent: text });
    del.setAttribute("aria-label", label);
    del.onclick = (e) => {
      e.preventDefault();
      ask(...asked, yes, run, del);
    };
    return { del };
  }

  /** A row of a card: its name over its detail (mono), then `end`, a Delete or a tag. */
  const row = (name, detail, ...end) => el("div", { className: "row" }, el("div", { className: "who" }, el("b", { textContent: name }), el("small", { textContent: detail })), ...end);

  // ---- Keys and signing keys: the library's section, a group each on the Keys tab.
  let adding = false;
  /** A group's heading, with how many it holds: the tabs carry no counts, so the bar fits a phone. */
  const lab = (text, n) => el("div", { className: "lab", textContent: n === undefined ? text : `${text} · ${n}` });

  /** The library's secret named `name` (any case) in `ks`, if any: a name is one secret. */
  const named = (ks, name) => [...ks.secrets, ...(ks.signing ?? []).map((g) => ({ ...g, kind: "signing" }))].find((x) => x.label.toLowerCase() === name.trim().toLowerCase());

  function drawKeys(ks) {
    const keys = $("apikeys");
    const needs = ks.needs.map((n) => {
      const f = form([["value", "Key", "password", false, "Paste the key"]], "Save key", async (v) => {
        if (!v.value) return toast("Paste the key first"), false;
        return post("keys", "key-save", { label: n.label, site: n.site, sealed: await seal(v.value) });
      }, [sealedNote()]);
      f.prepend(el("div", { style: "display:flex;flex-direction:column;gap:4px" }, el("b", { style: "font-size:17px;font-weight:600", textContent: "The agent asked for a key" }), el("span", { className: "cap", style: "padding:0;line-height:1.4", textContent: `It goes only to ${n.site}, and the agent never sees it.` })),
        el("dl", { className: "kv" }, el("dt", { textContent: "Name" }), el("dd", { textContent: n.label }), el("dt", { textContent: "Site" }), el("dd", { textContent: n.site })));
      return el("div", { className: "card need" }, f);
    });
    const saved = ks.secrets.map((k) => {
      const { del } = remove([`Delete the key ${k.label}?`, `The agent can’t call ${k.site} with it after.`], `Delete the key ${k.label}`, () => post("keys", "key-delete", { label: k.label }));
      return row(k.label, k.site, del);
    });
    const addForm = form([["label", "Name, like github"], ["site", "The site it goes to, like api.github.com", "text", true], ["value", "Key", "password"]], "Save key", async (v) => {
      if (!v.value || !v.label || !v.site) return toast("Fill in every field"), false;
      const taken = named(ks, v.label);
      if (taken?.kind === "signing") return toast("That name is a signing key’s: use another"), false;
      const went = await post("keys", "key-save", { label: v.label, site: v.site, sealed: await seal(v.value) });
      if (went) (adding = false), drawKeys(ks);
      return went;
    }, [sealedNote()]);
    const add = el("button", { className: "add", type: "button", onclick: () => ((adding = !adding), drawKeys(ks)) }, icon(adding ? "M4 8h8" : "M8 3v10M3 8h10"), adding ? "Cancel" : "Add a key");
    keys.replaceChildren(...needs, lab("API keys", saved.length), el("div", { className: "card" }, ...saved, ...(saved.length ? [] : [el("p", { className: "empty", textContent: "No keys yet. The agent asks for one when a task needs it." })]), el("div", {}, add, adding ? addForm : null)));

    drawSigning(ks);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !asking) return;
    e.preventDefault();
    asking.close();
  });

  // ---- Signing keys: the library's too. A function signs with one by its name and gets the
  // signature, never the key. Not a checkbox for scheduled jobs: an input with a value reads as busy.
  let addingSigning = false;
  function drawSigning(ks) {
    const list = ks.signing ?? [];
    const items = list.map((g) => {
      const { del } = remove([`Delete the signing key ${g.label}?`, `Nothing signs as it after, and it can’t be made again: its peers would need a new public key.`], `Delete the signing key ${g.label}`, () => post("keys", "signing-delete", { label: g.label }), { text: "Delete signing key", className: "btn bad" });
      // The open row shows the fingerprint, and the public key itself only where it can't be copied:
      // the clipboard needs https, and a refusal shows it too.
      const canCopy = !!(window.isSecureContext && navigator.clipboard);
      const pub = [el("dt", { textContent: "Public key", hidden: canCopy }), el("dd", { textContent: g.public, hidden: canCopy })];
      const facts = el("dl", { className: "kv" }, ...(g.fingerprint ? [el("dt", { textContent: "Fingerprint" }), el("dd", { className: "line", title: g.fingerprint, textContent: g.fingerprint })] : []), ...pub);
      const copy = g.public && canCopy && el("button", { className: "btn", type: "button", textContent: "Copy public key", onclick: async () => {
        try { await navigator.clipboard.writeText(g.public); toast("Copied"); } catch (e) {
          for (const x of pub) x.hidden = false;
          toast("Can’t copy here: select the public key and copy it");
        }
      } });
      const jobs = el("button", { className: "btn", type: "button", textContent: g.unattended ? "Stop it signing in scheduled jobs" : "Let it sign in scheduled jobs", onclick: () => post("keys", "signing-unattended", { label: g.label, on: !g.unattended }) });
      const tag = el("span", { className: "tag" + (g.public ? " ok" : ""), textContent: !g.public ? "Damaged" : g.unattended ? "Chats and jobs" : "Chats" });
      return el("details", {},
        el("summary", {}, row(g.label, g.namespace, tag, el("span", { className: "chev" }, icon("M4 6l4 4 4-4", 14)))),
        el("div", { className: "body" },
          g.public ? facts : el("p", { className: "say", textContent: "Damaged: delete it and import it again." }),
          el("div", { className: "pair" }, copy, jobs), del));
    });
    const addForm = form([["label", "Name, like muse"], ["namespace", "The namespace it signs in, like muse-coordination", "text", true], ["seed", "Seed to import, base64 (empty: make a new key)", "password"]], "Save signing key", async (v) => {
      if (!v.label || !v.namespace) return toast("Fill in the name and the namespace"), false;
      if (named(ks, v.label)) return toast("That name is taken: use another"), false;
      const fields = { label: v.label, namespace: v.namespace };
      const went = v.seed ? await post("keys", "signing-import", { ...fields, sealed: await seal(v.seed) }) : await post("keys", "signing-new", fields);
      if (went) (addingSigning = false), drawSigning(ks);
      return went;
    }, [sealedNote()]);
    const add = el("button", { className: "add", type: "button", onclick: () => ((addingSigning = !addingSigning), drawSigning(ks)) }, icon(addingSigning ? "M4 8h8" : "M8 3v10M3 8h10"), addingSigning ? "Cancel" : "Add a signing key");
    $("signing").replaceChildren(lab("Signing keys", items.length),
      el("div", { className: "card" }, ...items, ...(items.length ? [] : [el("p", { className: "empty", textContent: "No signing keys yet. Make one here when a function needs to sign." })]), el("div", {}, add, addingSigning ? addForm : null)));
  }

  // ---- Logins and passkeys: the browser's section, saved as the user signs in on a tab's page.
  function drawLogins(ls) {
    const rows = ls.logins.map((l) => {
      const passkey = l.kind === "passkey";
      const asked = passkey ? ["Delete this passkey?", `The agent can’t sign in to ${l.site} with it after. Remove it in the site’s own settings too.`] : ["Delete this login?", `The agent can’t sign in to ${l.site} with it after.`];
      const { del } = remove(asked, `Delete the ${passkey ? "passkey" : "login"} for ${l.site}`, () => post("logins", "login-delete", { id: l.id }));
      return row(l.site, [l.user, passkey ? "Passkey" : "Password"].filter(Boolean).join(" · "), del);
    });
    $("logins").replaceChildren(lab("Logins"), el("div", { className: "card" }, ...rows, ...(rows.length ? [] : [el("p", { className: "empty", textContent: "No logins yet. The browser offers to save one when you sign in on its tab’s page." })])),
      el("p", { className: "cap", textContent: "To change a password, sign in again on the tab." }));
  }

  // ---- Allowed addresses: either skill's, the origins on the user's network the skills may reach.
  let toldAt = null;
  // Dates in the page's own English, whatever the device's locale: "Mon 20 Oct" (its year too when
  // not this one), and a moment as "today, 10:12", "yesterday, 18:40" or "Mon 20 Oct, 10:12".
  const day = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + (d.getFullYear() === new Date().getFullYear() ? "" : ` ${d.getFullYear()}`);
  };
  const moment = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    // a refusal is kept a day (fence.mts), so it was today or yesterday
    return `${d.toDateString() === new Date().toDateString() ? "today" : "yesterday"}, ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`;
  };
  /** An address's row: the origin is set in mono. */
  const addr = (node) => (node.classList.add("addr"), node);
  function drawAddresses(as) {
    if (as.result && toldAt !== null && as.result.n !== toldAt) toast(as.result.error);
    toldAt = as.result ? as.result.n : 0;
    const allowed = as.origins.map((a) => {
      const { del } = remove(["Remove this address?", `The skills can’t reach ${a.origin} after.`], `Remove ${a.origin}`, () => post("addresses", "address-remove", { origin: a.origin }), { text: "Remove", yes: "Remove" });
      return addr(row(a.origin, a.added ? `Added ${day(a.added)}` : "", del));
    });
    const refused = as.refused.map((r) => {
      const allow = el("button", { className: "btn", type: "button", textContent: "Allow", ariaLabel: `Allow ${r.origin}`, onclick: () => post("addresses", "address-allow", { origin: r.origin }) });
      return addr(row(r.origin, `Refused ${moment(r.at)}`, allow));
    });
    const addForm = form([["origin", "An address, like http://muse-vm:8463", "text", true]], "Allow", (v) => (v.origin ? post("addresses", "address-allow", { origin: v.origin }) : (toast("Write the address first"), false)));
    $("addresses").replaceChildren(lab("Allowed addresses", allowed.length),
      el("div", { className: "card" }, ...allowed, ...(allowed.length ? [] : [el("p", { className: "empty", textContent: "None yet. The skills reach the public web only." })]), addForm),
      lab("Recently refused"),
      el("div", { className: "card" }, ...refused, ...(refused.length ? [] : [el("p", { className: "empty", textContent: "Nothing refused in the last day." })])),
      el("p", { className: "cap", textContent: "Machines on your own network the skills may reach. Give a machine’s name or network address, not localhost." }));
  }

  // ---- The sections there are, each its own state file; a tab for each. A section the user is in
  // the middle of (a form being filled) isn't drawn again under them, nor any while a question is open.
  const drawn = { keys: drawKeys, logins: drawLogins, addresses: drawAddresses };
  const shown = new Set();
  const last = {};
  const busy = (section) => !!asking || [...$(section).querySelectorAll("input")].some((i) => i.value || i === document.activeElement);
  const select = (b) => {
    for (const x of document.querySelectorAll("nav button")) x.setAttribute("aria-selected", String(x === b));
    for (const section of document.querySelectorAll("main section")) section.hidden = section.id !== b.dataset.tab;
  };
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => select(b);
  async function load() {
    try {
      const found = await Promise.all(Object.keys(drawn).map(async (section) => {
        const res = await fetch(`${cfg.token}-${section}.json`, { cache: "no-cache" });
        if (res.status === 404) return false;
        if (!res.ok) throw new Error(res.status);
        const text = await res.text();
        if (text !== last[section] && !busy(section)) (last[section] = text), drawn[section](JSON.parse(text));
        shown.add(section);
        return true;
      }));
      if (!found.some(Boolean)) return clearInterval(poll), toast("This link was replaced. Open the page again from where you got it: the agent, AnywhereLLM Lite, or anywherellm-suite pages."); // gone for good: said once
      const tabs = [...document.querySelectorAll("nav button")];
      for (const b of tabs) b.hidden = !shown.has(b.dataset.tab);
      document.querySelector("nav").hidden = tabs.filter((b) => !b.hidden).length < 2; // one tab says nothing
      $("rotatebox").hidden = !shown.size;
      if (!tabs.some((b) => !b.hidden && b.getAttribute("aria-selected") === "true")) select(tabs.find((b) => !b.hidden));
    } catch (e) {
      toast("Can’t reach AnythingLLM");
    }
  }

  // ---- A new link, asked first.
  const rotate = remove(["Make a new link?", "This one stops working, everywhere it was shared."], "Make a new link", () => post([...shown][0], "rotate"), { text: "New link", className: "btn", yes: "Make it" });
  $("foot").append(el("div", { id: "rotatebox", hidden: true }, rotate.del));
  const poll = setInterval(load, 5000);
  load();
})();
</script>
